// ===================== CUSTOM QUIZ BUILDER =====================
// Draws a paper from every non-pool level, filtered to the chosen official
// domains. The original banks use loose domain labels, so DOMAIN_OF maps the
// ones that clearly belong to an official domain; labels that don't (Claude API,
// Support Agent, Code Gen, Dev Productivity) are left out of custom quizzes.
const OFFICIAL_DOMAINS = [
  { key: 'agentic', label: 'Agentic Architecture', name: 'Agentic Architecture & Orchestration', pct: 27 },
  { key: 'tools',   label: 'Tool Design & MCP',    name: 'Tool Design & MCP Integration',        pct: 18 },
  { key: 'code',    label: 'Claude Code',          name: 'Claude Code Config & Workflows',       pct: 20 },
  { key: 'prompt',  label: 'Prompt & Output',      name: 'Prompt Engineering & Structured Output', pct: 20 },
  { key: 'context', label: 'Context & Reliability', name: 'Context Management & Reliability',    pct: 15 }
];
const DOMAIN_OF = {
  'Agentic Architecture & Orchestration': 'agentic', 'Agentic Arch': 'agentic', 'Multi-Agent': 'agentic',
  'Tool Design & MCP Integration': 'tools', 'Tool Design': 'tools', 'MCP': 'tools',
  'Claude Code Config & Workflows': 'code', 'Claude Code': 'code', 'CI/CD': 'code',
  'Prompt Engineering & Structured Output': 'prompt', 'Structured Output': 'prompt', 'Prompt Eng': 'prompt',
  'Context Management & Reliability': 'context', 'Context Mgmt': 'context'
};
const BUILDER_SIZES = [10, 20, 30, 60];
const builder = { domains: [], size: 20, mix: 'exam' }; // domains: [] = all

function questionsByDomain() {
  const by = Object.fromEntries(OFFICIAL_DOMAINS.map(d => [d.key, []]));
  Object.values(LEVELS).forEach(lv => {
    if (lv.pool) return;
    lv.questions.forEach(q => { const k = DOMAIN_OF[q.domain]; if (k) by[k].push(q); });
  });
  return by;
}

// Split `n` across the chosen domains — by exam weight or equally — never asking
// a domain for more than it holds, then hand leftovers to domains with spares.
function domainQuotas(keys, n, mix, by) {
  const w = k => mix === 'equal' ? 1 : OFFICIAL_DOMAINS.find(d => d.key === k).pct;
  const total = keys.reduce((a, k) => a + w(k), 0);
  const quota = Object.fromEntries(keys.map(k => [k, Math.min(by[k].length, Math.floor(n * w(k) / total))]));
  let left = n - Object.values(quota).reduce((a, b) => a + b, 0);
  while (left > 0) {
    const spare = keys.filter(k => quota[k] < by[k].length);
    if (!spare.length) break;
    spare.sort((a, b) => w(b) - w(a)).slice(0, left).forEach(k => { quota[k]++; left--; });
  }
  return quota;
}

function renderBuilder() {
  const by = questionsByDomain();
  const keys = builder.domains.length ? builder.domains : OFFICIAL_DOMAINS.map(d => d.key);
  const available = keys.reduce((a, k) => a + by[k].length, 0);
  const n = Math.min(builder.size, available);
  const chip = (attr, val, on, label, extra = '') =>
    `<button class="bq-chip${on ? ' on' : ''}" ${attr}="${val}">${label}${extra}</button>`;
  return `
    <div class="builder">
      <div class="bq-head">
        <div class="bq-title">Build a custom quiz</div>
        <div class="bq-sub">Pick domains to focus on; ${state.instantFeedback ? 'instant feedback is on, so it works as a review session' : 'feedback is off, so results come at the end'}.</div>
      </div>
      <div class="bq-row">
        <div class="bq-label">Domains</div>
        <div class="bq-chips">
          ${chip('data-bq-domain', 'all', !builder.domains.length, 'All domains')}
          ${OFFICIAL_DOMAINS.map(d => chip('data-bq-domain', d.key, builder.domains.includes(d.key), d.label, ` <span class="bq-n">${by[d.key].length}</span>`)).join('')}
        </div>
      </div>
      <div class="bq-row">
        <div class="bq-label">Balance</div>
        <div class="bq-chips">
          ${chip('data-bq-mix', 'exam', builder.mix === 'exam', 'Exam weighting')}
          ${chip('data-bq-mix', 'equal', builder.mix === 'equal', 'Equal per domain')}
        </div>
      </div>
      <div class="bq-row">
        <div class="bq-label">Questions</div>
        <div class="bq-chips">
          ${BUILDER_SIZES.map(s => chip('data-bq-size', s, builder.size === s, s)).join('')}
        </div>
      </div>
      <button class="btn bq-go" id="bqStart" ${n ? '' : 'disabled'}>Start quiz · ${n} Qs · ${Math.round(n * SECONDS_PER_QUESTION / 60)} min</button>
      <div class="bq-foot">Drawn from all ${available} matching questions across both sections. Custom quizzes don't post to the leaderboard.</div>
    </div>`;
}

function wireBuilder() {
  app.querySelectorAll('[data-bq-domain]').forEach(b => b.addEventListener('click', () => {
    const k = b.dataset.bqDomain;
    if (k === 'all') builder.domains = [];
    else if (builder.domains.includes(k)) builder.domains = builder.domains.filter(x => x !== k);
    else builder.domains = [...builder.domains, k];
    if (builder.domains.length === OFFICIAL_DOMAINS.length) builder.domains = [];
    renderStart();
  }));
  app.querySelectorAll('[data-bq-mix]').forEach(b => b.addEventListener('click', () => { builder.mix = b.dataset.bqMix; renderStart(); }));
  app.querySelectorAll('[data-bq-size]').forEach(b => b.addEventListener('click', () => { builder.size = Number(b.dataset.bqSize); renderStart(); }));
  document.getElementById('bqStart')?.addEventListener('click', startCustomQuiz);
}

function startCustomQuiz() {
  const by = questionsByDomain();
  const keys = builder.domains.length ? builder.domains : OFFICIAL_DOMAINS.map(d => d.key);
  const quota = domainQuotas(keys, builder.size, builder.mix, by);
  // Relabel with the official domain name so the results breakdown has one row per domain.
  const picked = keys.flatMap(k => shuffle(by[k]).slice(0, quota[k])
    .map(q => ({ ...q, domain: OFFICIAL_DOMAINS.find(d => d.key === k).name })));
  startPaper('custom', prepQuestions(buildRampedPaper(picked, picked.length), { keepOrder: true }), false);
}

function beginExam(levelKey) {
  const lv = LEVELS[levelKey];
  startPaper(levelKey, buildQuestions(lv), Boolean(lv.scenarioPick));
}

function startPaper(levelKey, questions, grouped) {
  state.level = levelKey;
  state.grouped = grouped;
  state.questions = questions;
  state.answers = new Array(state.questions.length).fill(null);
  state.struck = state.questions.map(() => new Set());
  state.flagged = new Array(state.questions.length).fill(false);
  state.current = 0;
  state.totalTime = state.questions.length * SECONDS_PER_QUESTION;
  state.timeLeft = state.totalTime;
  state.submitted = false;
  state.screen = 'exam';
  syncUserMenu();
  renderExam();
  startTimer();
}

function renderExam() {
  const q = state.questions[state.current];
  const ans = state.answers[state.current];
  const struckSet = state.struck[state.current];
  const answeredCount = state.questions.length - unansweredCount();
  const progress = (answeredCount / state.questions.length) * 100;
  const chosen = ans || [];
  // Instant feedback locks the item once it is fully answered.
  const locked = state.instantFeedback && isAnswered(q, ans);
  const letters = ['A','B','C','D','E'];
  // Verdict + correct answer + explanation, once the question is locked. It is
  // rendered twice: in the left column (#explainSide) on wide screens, and
  // inline under the options on narrow ones. CSS shows exactly one of them.
  const fbHtml = locked ? (() => {
    const right = isRight(q, ans);
    const answerText = q.correct.map(i => `<b>${letters[i]}.</b> ${q.options[i]}`).join('<br>');
    return `<div class="fb-panel ${right ? 'ok' : 'no'}">
         <div class="fb-verdict">${right ? '✓ Correct' : '✗ Incorrect'}</div>
         ${right ? '' : `<div class="fb-answer">Correct answer${q.correct.length > 1 ? 's' : ''}:<br>${answerText}</div>`}
         ${q.explain ? `<div class="fb-explain">${q.explain}</div>` : ''}
       </div>`;
  })() : '';
  const side = document.getElementById('explainSide');
  if (side) {
    side.innerHTML = fbHtml ? `<div class="section-label">Explanation · Question ${state.current + 1}</div>${fbHtml}` : '';
    side.toggleAttribute('hidden', !fbHtml);
  }

  app.innerHTML = `
    <div class="topbar">
      <div class="brand">CCAR-F <span>Simulator</span></div>
      <div class="timer" id="timer">${fmtTime(state.timeLeft)}</div>
      <div class="timer-controls">
        <button class="icon-btn" id="pauseBtn">⏸ Pause</button>
        <button class="icon-btn" id="exitBtn">✕ Exit</button>
      </div>
    </div>

    <div class="qmeta">
      <span class="qcount">Question ${state.current + 1} / ${state.questions.length}</span>
      <span class="domain-tag">${q.domain}</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" style="width:${progress}%"></div></div>
    <div class="exam-gap"></div>

    <div class="q-stage">
    <div class="side-rail left">
      <button class="side-btn" id="sidePrev" title="Previous question (←)" aria-label="Previous question" ${state.current === 0 ? 'disabled' : ''}>‹</button>
    </div>
    <div class="card${locked ? ' locked' : ''}">
      ${scenarioHeader(q, state.current)}
      <div class="qtext">${formatQuestion(q.q)}</div>
      ${q.multi ? `<div class="pick-hint">Select ${q.correct.length} · ${chosen.length} of ${q.correct.length} chosen</div>` : ''}
      ${q.options.map((opt, i) => {
        const sel = chosen.includes(i) ? ' selected' : '';
        const st = struckSet.has(i) ? ' struck' : '';
        // Instant feedback marks your picks right/wrong and, once locked, also
        // reveals any correct option you missed.
        let fb = '', mark = '';
        if (locked && chosen.includes(i)) {
          const right = q.correct.includes(i);
          fb = right ? ' fb-correct' : ' fb-wrong';
          mark = `<span class="fb-mark">${right ? '✓' : '✗'}</span>`;
        } else if (locked && q.correct.includes(i)) {
          fb = ' fb-correct';
          mark = `<span class="fb-mark">✓</span>`;
        }
        return `
          <div class="opt${sel}${st}${fb}" data-idx="${i}">
            <span class="opt-letter">${letters[i]}</span>
            <span class="opt-body">${opt}</span>
            ${mark}
            <button class="strike-btn" data-strike="${i}" title="Strike out">✕</button>
          </div>`;
      }).join('')}
      ${fbHtml ? `<div class="fb-inline">${fbHtml}</div>` : ''}
      <div style="font-size:0.76rem;color:var(--text-dim);margin-top:6px">Tip: right-click (or tap ✕ on) an option to cross it out as "definitely not this" — it stays crossed for review.</div>
    </div>
    <div class="side-rail right">
      ${state.current === state.questions.length - 1
        ? `<button class="side-btn submit" id="sideSubmit" title="Submit exam" aria-label="Submit exam">✓</button>`
        : `<button class="side-btn" id="sideNext" title="Next question (→)" aria-label="Next question">›</button>`}
    </div>
    </div>

    <div class="nav-row">
      <div class="nav-left">
        <button class="btn ghost" id="prevBtn" ${state.current === 0 ? 'disabled' : ''}>← Prev</button>
        <button class="flag-btn ${state.flagged[state.current] ? 'flagged' : ''}" id="flagBtn">${state.flagged[state.current] ? '★ Flagged' : '☆ Flag'}</button>
      </div>
      ${state.current === state.questions.length - 1
        ? `<button class="btn" id="submitBtn">Submit Exam</button>`
        : `<button class="btn" id="nextBtn">Next →</button>`}
    </div>
  `;

  // option select
  app.querySelectorAll('.opt').forEach(el => {
    el.addEventListener('click', (e) => {
      if (e.target.dataset.strike !== undefined) return;
      // In instant-feedback mode a fully answered item is final — otherwise seeing
      // "wrong" and switching would make the score meaningless.
      if (locked) return;
      const idx = parseInt(el.dataset.idx);
      if (!q.multi) {
        state.answers[state.current] = [idx];
      } else if (chosen.includes(idx)) {
        const rest = chosen.filter(x => x !== idx);
        state.answers[state.current] = rest.length ? rest : null;
      } else if (chosen.length < q.correct.length) {
        state.answers[state.current] = [...chosen, idx];
      } else {
        return; // already at the stated count; deselect one first
      }
      renderExam();
    });
    // right-click to strike through (mark as "definitely not this")
    el.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      const idx = parseInt(el.dataset.idx);
      if (struckSet.has(idx)) struckSet.delete(idx); else struckSet.add(idx);
      // if you strike your currently-selected answer, clear the selection
      // (unless instant feedback has already locked it in)
      if (struckSet.has(idx) && chosen.includes(idx) && !locked) {
        const rest = chosen.filter(x => x !== idx);
        state.answers[state.current] = rest.length ? rest : null;
      }
      renderExam();
    });
  });
  // strike
  app.querySelectorAll('.strike-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const idx = parseInt(btn.dataset.strike);
      if (struckSet.has(idx)) struckSet.delete(idx); else struckSet.add(idx);
      renderExam();
    });
  });
  document.getElementById('prevBtn')?.addEventListener('click', () => goToQuestion(state.current - 1));
  document.getElementById('nextBtn')?.addEventListener('click', () => goToQuestion(state.current + 1));
  document.getElementById('sidePrev')?.addEventListener('click', () => goToQuestion(state.current - 1));
  document.getElementById('sideNext')?.addEventListener('click', () => goToQuestion(state.current + 1));
  document.getElementById('sideSubmit')?.addEventListener('click', confirmSubmit);
  document.getElementById('flagBtn')?.addEventListener('click', () => { state.flagged[state.current] = !state.flagged[state.current]; renderExam(); });
  document.getElementById('submitBtn')?.addEventListener('click', confirmSubmit);
  document.getElementById('pauseBtn')?.addEventListener('click', pauseExam);
  document.getElementById('exitBtn')?.addEventListener('click', () => {
    resetToMenu();
  });
  syncPrep();
  updateTimerDisplay();
}

// Right-hand panel during an exam: live score and a numbered grid to jump
// between questions. Right/wrong colours only show with instant feedback on;
// otherwise a cell is just "answered", so real-exam mode gives nothing away.
function renderPalette() {
  const qs = state.questions;
  const fbOn = state.instantFeedback;
  let correct = 0, wrong = 0;
  const cells = qs.map((q, i) => {
    const a = state.answers[i];
    let cls = '';
    if (isAnswered(q, a)) {
      if (!fbOn) cls = ' answered';
      else if (isRight(q, a)) { cls = ' right'; correct++; }
      else { cls = ' wrong'; wrong++; }
    }
    if (i === state.current) cls += ' current';
    if (state.flagged[i]) cls += ' flagged';
    return `<button class="pal-cell${cls}" data-jump="${i}">${i + 1}</button>`;
  }).join('');
  const answered = qs.length - unansweredCount();
  let stats = `<div class="pal-stat"><span>Question</span><b>${state.current + 1} / ${qs.length}</b></div>
    <div class="pal-stat"><span>Answered</span><b>${answered} / ${qs.length}</b></div>`;
  if (fbOn) {
    const acc = answered ? Math.round(correct / answered * 100) : 0;
    const onTrack = acc >= 72; // 720/1000 pass mark
    stats += answered ? `
      <div class="pal-pct ${onTrack ? 'ok' : 'no'}">${acc}%</div>
      <div class="pal-sub">${onTrack ? 'On track to pass (72% needed)' : 'Below the 72% pass mark'}</div>` : `
      <div class="pal-sub" style="margin-top:8px">Your live pass percentage appears after your first answer.</div>`;
    stats += `
      <div class="pal-stat"><span style="color:var(--good)">Correct</span><b>${correct}</b></div>
      <div class="pal-stat"><span style="color:var(--bad)">Incorrect</span><b>${wrong}</b></div>`;
  }
  return `<div class="section-label">Progress</div>
    <div class="pal-card">${stats}</div>
    <div class="pal-grid">${cells}</div>`;
}

// Move to question `i` and bring its top into view: after a long explanation
// the next question would otherwise open scrolled halfway down.
function goToQuestion(i) {
  if (i < 0 || i >= state.questions.length) return;
  state.current = i;
  renderExam();
  window.scrollTo({ top: 0 });
}

function pauseExam() {
  stopTimer();
  state.screen = 'paused';
  syncUserMenu();
  const unanswered = unansweredCount();
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.id = 'pauseOverlay';
  overlay.innerHTML = `
    <div class="overlay-card">
      <h2>⏸ Paused</h2>
      <p>Time remaining: <b style="color:var(--lime);font-family:var(--font-mono)">${fmtTime(state.timeLeft)}</b><br>
      ${unanswered} question${unanswered!==1?'s':''} still unanswered</p>
      <button class="btn" id="resumeBtn">▶ Resume Exam</button>
    </div>`;
  document.body.appendChild(overlay);
  document.getElementById('resumeBtn').addEventListener('click', () => {
    document.getElementById('pauseOverlay').remove();
    state.screen = 'exam';
    syncUserMenu();
    startTimer();
  });
}

function confirmSubmit() {
  const unanswered = unansweredCount();
  stopTimer();
  showConfirm({
    title: unanswered > 0 ? `${unanswered} question${unanswered!==1?'s':''} still unanswered` : 'Submit your exam?',
    body: unanswered > 0 ? 'Unanswered questions are scored as incorrect. Submit anyway?' : 'You will see your score and full answer review.',
    confirmLabel: 'Submit exam',
    onConfirm: finishExam,
    onCancel: () => { if (state.screen === 'exam') startTimer(); }
  });
}

function finishExam() {
  stopTimer();
  state.screen = 'results';
  syncUserMenu();
  renderResults();
}

function renderResults() {
  const qs = state.questions;
  let correct = 0;
  const domainStats = {};
  qs.forEach((q, i) => {
    if (!domainStats[q.domain]) domainStats[q.domain] = { correct: 0, total: 0 };
    domainStats[q.domain].total++;
    if (isRight(q, state.answers[i])) { correct++; domainStats[q.domain].correct++; }
  });
  const scaled = Math.round((correct / qs.length) * 1000);
  const passed = scaled >= PASS_SCORE;
  // Completing a level unlocks anything that requires it.
  // A custom quiz (state.level 'custom') is not a level: it neither unlocks
  // anything nor posts, since a 10-question drill isn't comparable on the board.
  const isLevel = Boolean(LEVELS[state.level]);
  if (isLevel) markCompleted(state.level);
  // Publish this attempt to the team leaderboard (the board ranks each
  // person's best score per exam; every attempt is kept for the profile view).
  if (user.name && !state.submitted && isLevel) {
    state.submitted = true;
    submitScore({
      name: user.name,
      score: scaled,
      passed,
      level: LEVELS[state.level] ? LEVELS[state.level].name : '',
      total: qs.length,
      at: Date.now()
    }).then(refreshBoard);
  }
  const timeUsed = (state.totalTime || EXAM_DURATION) - state.timeLeft;
  const skipped = unansweredCount();
  const incorrect = qs.length - correct - skipped;

  const domainRows = Object.entries(domainStats).map(([d, s]) => {
    const pct = Math.round((s.correct / s.total) * 100);
    const color = pct < 60 ? 'var(--bad)' : pct >= 85 ? 'var(--good)' : 'var(--amber)';
    return `<div class="domain-row">
      <div class="domain-name">${d}</div>
      <div class="domain-bar-bg"><div class="domain-bar-fill" style="width:${pct}%;background:${color}"></div></div>
      <div class="domain-score" style="color:${color}">${s.correct}/${s.total}</div>
    </div>`;
  }).join('');

  app.innerHTML = `
    <div class="topbar">
      <div class="brand">CCAR-F <span>Results</span></div>
      <button class="icon-btn" id="homeBtn">↺ New Exam</button>
    </div>

    <div class="result-hero">
      <div class="score-ring ${passed ? 'pass' : 'fail'}">${scaled}<span style="font-size:1.2rem;color:var(--text-dim)">/1000</span></div>
      <div class="verdict" style="color:${passed ? 'var(--good)' : 'var(--bad)'}">${passed ? '✓ PASS' : '✗ Below passing'}</div>
      <div class="score-sub">Passing score is ${PASS_SCORE}/1000 · You got ${correct} of ${qs.length} correct</div>
      ${(() => {
        const justUnlocked = Object.values(LEVELS).filter(lv => lv.requires === state.level && lv.ready);
        return justUnlocked.length
          ? `<div style="margin-top:14px;display:inline-block;background:var(--lime-dim);color:var(--lime);
               border-radius:20px;padding:7px 16px;font-size:0.83rem;font-weight:700">
               🔓 Unlocked: ${justUnlocked.map(lv => escapeHtml(lv.name)).join(' · ')}
             </div>`
          : '';
      })()}
      <div class="stat-row">
        <div class="stat"><div class="num" style="color:var(--good)">${correct}</div><div class="lbl">Correct</div></div>
        <div class="stat"><div class="num" style="color:var(--bad)">${incorrect}</div><div class="lbl">Wrong</div></div>
        <div class="stat"><div class="num" style="color:var(--text-dim)">${skipped}</div><div class="lbl">Skipped</div></div>
        <div class="stat"><div class="num">${fmtTime(timeUsed)}</div><div class="lbl">Time used</div></div>
      </div>
    </div>

    <div class="card">
      <div class="section-label">Domain breakdown</div>
      ${domainRows}
    </div>

    <div class="section-label">Question review</div>
    <div class="pal-grid results-grid">${qs.map((q, i) => {
      const a = state.answers[i];
      const cls = !isAnswered(q, a) ? 'skipped' : isRight(q, a) ? 'right' : 'wrong';
      return `<button class="pal-cell ${cls}${state.flagged[i] ? ' flagged' : ''}" data-rv="${i}" title="Question ${i + 1}">${i + 1}</button>`;
    }).join('')}</div>
    <div class="results-legend">Green correct · red wrong · dashed skipped. Click a number to jump to it below.</div>
    <div class="filter-row">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="incorrect">Wrong only</button>
      <button class="filter-btn" data-filter="skipped">Skipped</button>
      <button class="filter-btn" data-filter="flagged">Flagged</button>
    </div>
    <div id="reviewList"></div>
  `;

  document.getElementById('homeBtn').addEventListener('click', () => { resetToMenu(); });
  app.querySelectorAll('.filter-btn').forEach(b => b.addEventListener('click', () => {
    app.querySelectorAll('.filter-btn').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    state.reviewFilter = b.dataset.filter;
    renderReviewList();
  }));
  // Results grid: jump to a question's review item, clearing a filter that hides it.
  app.querySelectorAll('[data-rv]').forEach(b => b.addEventListener('click', () => {
    let el = document.getElementById('rv-' + b.dataset.rv);
    if (!el) {
      state.reviewFilter = 'all';
      app.querySelectorAll('.filter-btn').forEach(x => x.classList.toggle('active', x.dataset.filter === 'all'));
      renderReviewList();
      el = document.getElementById('rv-' + b.dataset.rv);
    }
    el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    el.classList.add('flash');
    setTimeout(() => el.classList.remove('flash'), 1200);
  }));
  renderReviewList();
  window.scrollTo(0, 0);
}

function renderReviewList() {
  const qs = state.questions;
  const letters = ['A','B','C','D','E'];
  const list = document.getElementById('reviewList');
  const items = qs.map((q, i) => {
    const your = state.answers[i];
    const chosen = your || [];
    const isCorrect = isRight(q, your);
    const isSkipped = !isAnswered(q, your);
    let statusClass = isSkipped ? 'skipped' : isCorrect ? 'correct' : 'incorrect';
    if (state.reviewFilter === 'incorrect' && (isCorrect || isSkipped)) return '';
    if (state.reviewFilter === 'skipped' && !isSkipped) return '';
    if (state.reviewFilter === 'flagged' && !state.flagged[i]) return '';

    const tag = isSkipped ? `<span class="tag-mini" style="background:#ffffff11;color:var(--text-dim)">Skipped</span>`
      : isCorrect ? `<span class="tag-mini" style="background:#7ed95722;color:var(--good)">Correct</span>`
      : `<span class="tag-mini" style="background:#e5674b22;color:var(--bad)">Wrong</span>`;

    const opts = q.options.map((opt, oi) => {
      let cls = 'review-opt neutral';
      const isKey = q.correct.includes(oi);
      if (isKey) cls = 'review-opt right-answer';
      if (chosen.includes(oi) && isKey) cls = 'review-opt your-correct';
      if (chosen.includes(oi) && !isKey) cls = 'review-opt your-wrong';
      const wasStruck = state.struck[i] && state.struck[i].has(oi);
      if (wasStruck) cls += ' struck-review';
      const mark = isKey ? ' ✓' : (chosen.includes(oi) ? ' ✗ (your answer)' : '');
      const struckTag = wasStruck ? ' <span style="font-size:0.7rem;color:var(--text-dim)">(you crossed out)</span>' : '';
      return `<div class="${cls}">${letters[oi]}. ${opt}${mark}${struckTag}</div>`;
    }).join('');

    return `
      <div class="review-item ${statusClass}" id="rv-${i}">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <span class="domain-tag">${q.domain}</span>
          <span>${tag} ${state.flagged[i] ? '<span class="tag-mini" style="background:#e8b04b22;color:var(--amber)">★ Flagged</span>' : ''}</span>
        </div>
        <div class="review-q">Q${i+1}.${SCENARIOS[q.scenario] ? ` <span class="review-scenario">${SCENARIOS[q.scenario].name}</span>` : ''} ${formatQuestion(q.q)}${q.multi ? ` <span class="review-scenario">Select ${q.correct.length}</span>` : ''}</div>
        ${opts}
        <div class="review-explain"><b style="color:var(--lime)">Why:</b> ${q.explain}</div>
      </div>`;
  }).join('');
  list.innerHTML = items || `<p style="color:var(--text-dim);text-align:center;padding:20px">Nothing to show for this filter.</p>`;
}

// init
// ===================== BOOT =====================
async function boot() {
  app.innerHTML = `<div class="gate"><p style="margin-top:6vh">Loading question banks…</p></div>`;
  try {
    await loadLevels();
    await loadResources();
  } catch (err) {
    app.innerHTML = `
      <div class="gate">
        <h1>Couldn't load <span>questions</span></h1>
        <p>${escapeHtml(err.message)}</p>
        <p style="font-size:0.85rem">This usually means <code>index.html</code> was opened directly from
        disk. The question banks are fetched over HTTP, so the app needs to be served.
        From the project folder run <b style="color:var(--text)">vercel dev</b> (full app, including the
        leaderboard) or <b style="color:var(--text)">python3 -m http.server 3000</b> (questions only),
        then open the URL it prints.</p>
      </div>`;
    return;
  }

  const storedName = loadName();
  if (storedName) {
    user.name = storedName;
    adoptLegacyProgress();
    renderStart();
    refreshBoard();
  } else {
    renderNameGate();
  }
}

boot();
</script>
</body>
</html>
