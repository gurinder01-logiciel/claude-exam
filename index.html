<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CCAF Exam Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f7f9;
    --surface: #ffffff;
    --surface-2: #f0f3f5;
    --border: #e2e8ec;
    --lime: #26d07c;          /* Leap signature green */
    --lime-dim: #26d07c1a;
    --lime-dark: #1fa763;
    --amber: #f0a828;
    --text: #2e2e2e;
    --text-dim: #7a8894;
    --good: #26d07c;
    --bad: #e0524d;
    --font-body: "Inter", "Aileron", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --font-display: "Poppins", "Inter", sans-serif;
    --font-mono: "SF Mono", "JetBrains Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font-body);
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    padding: 20px 16px 60px;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 780px; margin: 0 auto; }

  /* Shell: leaderboard sidebar (left, via order:-1) + main column + prep panel (right) */
  .shell { display: flex; gap: 24px; max-width: 1500px; margin: 0 auto; align-items: flex-start; }
  .shell .wrap { flex: 1; min-width: 0; margin: 0; max-width: 880px; }
  /* Left column: leaderboard, plus the explanation panel during an exam. The
     column (not the board) is sticky and scrolls if both together are too tall. */
  .left-col {
    width: 290px; flex-shrink: 0; position: sticky; top: 20px; order: -1;
    max-height: calc(100vh - 40px); overflow-y: auto; display: flex; flex-direction: column; gap: 14px;
  }
  .explain-side .fb-panel { margin-top: 0; background: var(--surface); border: 1px solid var(--border); border-left-width: 3px; box-shadow: 0 2px 12px rgba(46,46,46,0.05); }
  .explain-side .section-label { margin: 4px 0 8px; }
  /* The left column only exists during an exam; elsewhere the main column is centred. */
  body:not([data-screen="exam"]):not([data-screen="paused"]) .left-col { display: none; }
  body:not([data-screen="exam"]):not([data-screen="paused"]) .shell .wrap { margin: 0 auto; }
  body[data-screen="start"] .shell .wrap { max-width: 1180px; }
  /* Leaderboard below the page content; hidden during an exam on wide screens. */
  .board-dock { max-width: 1180px; margin: 10px auto 40px; padding: 0 16px; }
  /* Not on the How to prepare page (incl. the 🏆 drawer button on narrow screens). */
  body[data-screen="prep"] .board-dock, body[data-screen="prep"] .board-toggle { display: none !important; }
  @media (min-width: 1081px) { body[data-screen="exam"] .board-dock, body[data-screen="paused"] .board-dock { display: none; } }
  /* Wide screens show the explanation in the left column, so hide the inline copy. */
  @media (min-width: 1081px) { .fb-inline { display: none; } }
  @media (max-width: 1080px) {
    .left-col { width: auto; position: static; max-height: none; overflow: visible; display: block; }
    .explain-side { display: none !important; }
  }
  .sidebar {
    width: 100%;
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
    padding: 20px; box-shadow: 0 2px 12px rgba(46,46,46,0.05);
  }
  .sidebar h3 {
    font-family: var(--font-display); font-size: 0.95rem; font-weight: 700;
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px;
  }
  .sidebar .lb-sub { font-size: 0.75rem; color: var(--text-dim); margin-bottom: 16px; }
  .lb-row {
    display: flex; align-items: center; gap: 10px; padding: 9px 0;
    border-bottom: 1px solid var(--border); font-size: 0.85rem;
  }
  .lb-row:last-child { border-bottom: none; }
  .lb-code { color: var(--lime); font-weight: 700; font-family: var(--font-mono); font-size: 0.82em; }
  .lb-row.me { background: var(--lime-dim); margin: 0 -10px; padding: 9px 10px; border-radius: 8px; border-bottom-color: transparent; }
  .lb-rank {
    font-family: var(--font-mono); font-weight: 700; color: var(--text-dim);
    min-width: 22px; font-size: 0.8rem;
  }
  .lb-rank.top { color: var(--lime); }
  .lb-name { flex: 1; min-width: 0; font-weight: 600; }
  .lb-meta { display: block; font-size: 0.68rem; color: var(--text-dim); font-weight: 400; line-height: 1.35; }
  .lb-score { font-family: var(--font-mono); font-weight: 700; font-size: 0.85rem; flex-shrink: 0; width: 62px; text-align: right; }
  .lb-empty { font-size: 0.82rem; color: var(--text-dim); text-align: center; padding: 20px 0; line-height: 1.5; }
  /* Account menu — fixed to the top-right corner, above the sidebar drawer */
  .user-menu { position: fixed; top: 16px; right: 20px; z-index: 100; }
  .avatar {
    width: 42px; height: 42px; border-radius: 50%; cursor: pointer;
    background: var(--surface); border: 1px solid var(--border);
    font-family: var(--font-display); font-size: 0.85rem; font-weight: 700; color: var(--text);
    box-shadow: 0 2px 10px rgba(46,46,46,0.08); transition: border-color .15s, box-shadow .15s;
  }
  .avatar:hover, .user-menu.open .avatar { border-color: var(--lime); box-shadow: 0 2px 14px rgba(38,208,124,0.28); }
  .user-pop {
    position: absolute; top: 52px; right: 0; width: 210px; overflow: hidden;
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    box-shadow: 0 10px 34px rgba(46,46,46,0.16);
  }
  .user-pop-head { padding: 12px 14px; border-bottom: 1px solid var(--border); }
  .user-pop-label { display: block; font-size: 0.66rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.07em; }
  .user-pop-name { display: block; font-weight: 700; font-size: 0.9rem; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .user-pop-item {
    display: block; width: 100%; padding: 11px 14px; background: none; border: none;
    font-family: inherit; font-size: 0.85rem; font-weight: 600; color: var(--text);
    text-align: left; cursor: pointer;
  }
  .user-pop-item:hover { background: var(--lime-dim); }
  .user-pop-item.danger { color: var(--bad); border-top: 1px solid var(--border); }
  .user-pop-item.danger:hover { background: rgba(224,82,77,0.08); }
  @media (max-width: 1080px) {
    /* Clear of the 🏆 drawer button, which sits bottom-left */
    .user-menu { top: 12px; right: 12px; }
  }

  /* My profile screen */
  .profile-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 4px; }
  .profile-stats {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 12px;
    margin: 22px 0 28px;
  }
  .profile-stat {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px;
  }
  .profile-stat .num { font-family: var(--font-mono); font-size: 1.35rem; font-weight: 700; }
  .profile-stat .lbl { font-size: 0.7rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.06em; }
  .attempt {
    display: flex; align-items: center; gap: 14px; padding: 14px 16px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 10px;
  }
  .attempt-main { flex: 1; min-width: 0; }
  .attempt-level { font-weight: 600; font-size: 0.92rem; }
  .attempt-meta { font-size: 0.75rem; color: var(--text-dim); margin-top: 2px; }
  .attempt-score { font-family: var(--font-mono); font-weight: 700; font-size: 1.05rem; flex-shrink: 0; }
  .attempt-badge {
    flex-shrink: 0; font-size: 0.68rem; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.05em; padding: 4px 9px; border-radius: 20px;
  }
  .attempt-badge.pass { background: var(--lime-dim); color: var(--good); }
  .attempt-badge.fail { background: rgba(46,46,46,0.06); color: var(--text-dim); }
  .board-toggle { display: none; }

  /* Too narrow for three columns: the prep panel wraps to its own full-width row.
     The .prep overrides live with the .prep rule further down — this file's later
     rules would otherwise win, since a media query adds no specificity. */
  @media (max-width: 1340px) {
    .shell { flex-wrap: wrap; }
  }

  @media (max-width: 1080px) {
    .shell { display: block; }
    .sidebar {
      position: fixed; top: 0; left: 0; bottom: 0; width: 300px; z-index: 90;
      border-radius: 0; overflow-y: auto; transform: translateX(-100%);
      transition: transform .22s ease; box-shadow: 8px 0 30px rgba(46,46,46,0.14);
    }
    .sidebar.open { transform: translateX(0); }
    .board-toggle {
      display: block; position: fixed; bottom: 20px; left: 20px; z-index: 95;
      width: 52px; height: 52px; border-radius: 50%; border: 1px solid var(--border);
      background: var(--surface); font-size: 1.3rem; cursor: pointer;
      box-shadow: 0 4px 16px rgba(46,46,46,0.16);
    }
  }

  /* Name gate */
  .gate { max-width: 420px; margin: 8vh auto 0; text-align: center; }
  .gate h1 { font-family: var(--font-display); font-size: 1.9rem; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 8px; }
  .gate h1 span { color: var(--lime); }
  .gate p { color: var(--text-dim); font-size: 0.92rem; margin-bottom: 26px; }
  .gate input {
    width: 100%; padding: 14px 16px; font-size: 1rem; font-family: inherit;
    background: var(--surface); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px; margin-bottom: 12px;
  }
  .gate input:focus { outline: none; border-color: var(--lime); }
  .gate .err { color: var(--bad); font-size: 0.8rem; min-height: 18px; margin-bottom: 6px; }

  /* Header */
  .topbar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 16px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; margin-bottom: 20px; position: sticky; top: 12px; z-index: 20;
    box-shadow: 0 2px 12px rgba(46,46,46,0.06);
  }
  .brand { font-family: var(--font-display); font-weight: 700; letter-spacing: -0.01em; font-size: 0.95rem; }
  .brand span { color: var(--lime); }
  .timer {
    font-family: var(--font-mono); font-size: 1.15rem; font-weight: 600;
    display: flex; align-items: center; gap: 12px;
  }
  .timer.warn { color: var(--amber); }
  .timer.danger { color: var(--bad); animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: 0.5; } }
  .timer-controls { display: flex; gap: 6px; }
  .icon-btn {
    background: var(--surface-2); border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 6px 12px; font-size: 0.8rem; cursor: pointer; font-weight: 600;
    transition: all .15s;
  }
  .icon-btn:hover { border-color: var(--lime); color: var(--lime); }

  /* Start screen */
  .hero { text-align: center; padding: 30px 0 10px; }
  .hero h1 { font-family: var(--font-display); font-size: 2.2rem; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 8px; }
  .hero h1 span { color: var(--lime); }
  .hero p { color: var(--text-dim); max-width: 520px; margin: 0 auto 8px; font-size: 0.95rem; }
  .meta-row {
    display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin: 20px 0 30px;
  }
  .chip {
    background: var(--surface); border: 1px solid var(--border); border-radius: 20px;
    padding: 6px 14px; font-size: 0.8rem; color: var(--text-dim);
  }
  .chip b { color: var(--text); font-weight: 600; }

  .section-label {
    font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.12em;
    color: var(--text-dim); margin-bottom: 12px; font-weight: 600;
  }
  .levels { display: grid; gap: 12px; }
  /* Start-screen sections */
  .sec-head { margin: 18px 0 10px; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .sec-title { font-family: var(--font-display); font-size: 1.1rem; font-weight: 800; }
  .sec-sub { font-size: 0.78rem; color: var(--text-dim); }
  /* Custom quiz builder */
  .builder { background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--lime); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; display: grid; gap: 10px; }
  .bq-title { font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; }
  .bq-sub, .bq-foot { font-size: 0.78rem; color: var(--text-dim); margin-top: 2px; }
  .bq-row { display: grid; grid-template-columns: 90px 1fr; gap: 10px; align-items: start; }
  /* Mock Exam Bank: exam tiles on the left, quiz builder on the right. The builder
     column is narrow, so its labels sit above their chips. */
  .bank-split { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 14px; align-items: start; }
  .bank-split .levels.bank { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); margin-bottom: 0; }
  .bank-split .builder { margin-bottom: 0; position: sticky; top: 16px; }
  .bank-split .bq-row { grid-template-columns: 1fr; gap: 6px; }
  .bank-split .bq-label { padding-top: 0; }
  .bank-split .bq-go { justify-self: stretch; }
  @media (max-width: 900px) { .bank-split { grid-template-columns: 1fr; } .bank-split .builder { position: static; } }
  .bq-label { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); padding-top: 8px; }
  .bq-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .bq-chip { background: var(--surface-2); border: 1px solid var(--border); color: var(--text); border-radius: 999px; padding: 6px 13px; font: 600 0.8rem/1.2 inherit; font-family: inherit; cursor: pointer; }
  .bq-chip:hover { border-color: var(--lime); }
  .bq-chip.on { background: var(--lime-dim); border-color: var(--lime); color: var(--lime); }
  .bq-n { font-family: var(--font-mono); font-size: 0.72rem; opacity: 0.7; }
  .bq-go { justify-self: start; }
  @media (max-width: 560px) { .bq-row { grid-template-columns: 1fr; } .bq-label { padding-top: 0; } }
  .level-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 18px 20px; cursor: pointer; transition: all .18s; text-align: left;
    display: flex; flex-direction: column; gap: 14px;
    color: var(--text); width: 100%; font-family: inherit;
  }
  .lc-top { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
  .level-card:hover:not(:disabled) { border-color: var(--lime); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(38,208,124,0.15); }
  .level-card:disabled { opacity: 0.5; cursor: not-allowed; }
  .level-card .lc-title { font-family: var(--font-display); font-size: 1.05rem; font-weight: 700; margin-bottom: 3px; }
  .level-card .lc-desc { font-size: 0.83rem; color: var(--text-dim); }
  .level-card .lc-badge {
    font-size: 0.7rem; padding: 4px 10px; border-radius: 20px; font-weight: 700;
    white-space: nowrap; text-transform: uppercase; letter-spacing: 0.04em;
  }
  .badge-ready { background: var(--lime-dim); color: var(--lime); }
  .badge-soon { background: #00000008; color: var(--text-dim); }
  .lc-num { font-family: var(--font-mono); font-size: 1.15rem; font-weight: 700; color: var(--lime); }
  /* Compact start screen: every exam on one screen */
  .hero-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding: 18px 0 4px; }
  .hero-title { font-family: var(--font-display); font-size: 1.7rem; font-weight: 800; letter-spacing: -0.02em; margin: 0 0 8px; }
  .hero-title span { color: var(--lime); }
  .hero-chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .hero-chips .chip { padding: 4px 11px; font-size: 0.76rem; }
  .chips-label { align-self: center; font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); }
  .fb-note { display: block; font-size: 0.72rem; color: var(--text-dim); margin-top: 2px; }
  .prep-link { white-space: nowrap; }
  .fb-toggle.compact { padding: 9px 14px; margin-top: 12px; }
  .fb-toggle.compact .fb-d { display: inline; margin: 0; }
  .levels.path { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .levels.bank { grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); margin-bottom: 12px; }
  .levels .level-card { padding: 12px 14px; gap: 6px; border-radius: 12px; }
  .levels .lc-top { gap: 8px; }
  .levels .lc-title { font-family: var(--font-display); font-size: 0.98rem; font-weight: 700; line-height: 1.25; }
  .levels .lc-desc { font-size: 0.76rem; color: var(--text-dim); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .levels .lc-meta { font-size: 0.72rem; color: var(--text-dim); }
  .levels .lc-meta b { color: var(--text); }
  .levels .lc-badge { font-size: 0.64rem; padding: 3px 8px; border-radius: 20px; font-weight: 700; white-space: nowrap; text-transform: uppercase; letter-spacing: 0.04em; }
  .levels .bp-bar { height: 5px; margin-top: 2px; }
  .start-foot { color: var(--text-dim); font-size: 0.8rem; text-align: center; margin: 18px 0 8px; }
  .start-foot b { color: var(--text); }
  .start-foot a { color: var(--lime); text-decoration: none; font-weight: 600; }
  .prep-page { margin-top: 18px; }
  @media (max-width: 760px) { .levels.path { grid-template-columns: 1fr; } }
  /* Blueprint (scenario mix) */
  .bp-bar { display: flex; height: 8px; border-radius: 5px; overflow: hidden; background: var(--surface-2); }
  .bp-seg { height: 100%; }
  .bp-legend { display: flex; flex-wrap: wrap; gap: 10px 14px; }
  .bp-item { display: flex; align-items: center; gap: 5px; font-size: 0.74rem; color: var(--text-dim); font-weight: 600; }
  .bp-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }

  /* Question screen */
  .qmeta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .qcount { font-size: 0.85rem; color: var(--text-dim); font-family: var(--font-mono); }
  .domain-tag {
    display: inline-block; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--lime); background: var(--lime-dim); padding: 4px 10px; border-radius: 20px; font-weight: 700;
  }
  /* With the palette on the right (wide screens) the question count and progress
     bar repeat it, so they hide; the palette shows "Question N / M" instead. */
  @media (min-width: 1341px) { .qmeta, .progress-bar { display: none; } .exam-gap { height: 14px; } }
  .progress-bar { height: 5px; background: var(--border); border-radius: 3px; overflow: hidden; margin-bottom: 20px; }
  .progress-fill { height: 100%; background: var(--lime); transition: width .3s ease; }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
    padding: 24px; margin-bottom: 16px; box-shadow: 0 2px 12px rgba(46,46,46,0.05);
  }
  .qtext { font-size: 1.12rem; margin-bottom: 20px; line-height: 1.5; font-weight: 500; }
  .scenario-banner {
    display: block; font-size: 0.74rem; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--text-dim); background: var(--surface-2);
    border-left: 3px solid var(--lime); border-radius: 0 6px 6px 0;
    padding: 7px 12px; margin-bottom: 14px;
  }
  .review-scenario {
    display: inline-block; font-size: 0.68rem; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.05em; color: var(--text-dim); background: var(--surface-2);
    border-radius: 4px; padding: 2px 7px; margin-right: 4px; vertical-align: middle;
  }
  .scenario-intro {
    background: var(--surface-2); border: 1px solid var(--border);
    border-left: 3px solid var(--lime); border-radius: 0 8px 8px 0;
    padding: 12px 16px; margin-bottom: 16px;
  }
  .scenario-intro-label {
    font-size: 0.74rem; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--text-dim); margin-bottom: 6px;
  }
  .scenario-intro p {
    margin: 0; font-size: 0.92rem; line-height: 1.5; color: var(--text);
  }
  .opt {
    display: flex; align-items: flex-start; gap: 12px; width: 100%; text-align: left;
    background: var(--surface-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; cursor: pointer;
    font-size: 0.96rem; font-family: inherit; transition: all .14s; line-height: 1.4;
  }
  .opt:hover:not(.struck) { border-color: var(--lime); }
  .opt.selected { border-color: var(--lime); background: var(--lime-dim); }
  .opt.struck { opacity: 0.4; text-decoration: line-through; }
  .pick-hint { display: inline-block; font-size: 0.78rem; font-weight: 600; color: var(--lime); border: 1px solid var(--lime); border-radius: 999px; padding: 2px 10px; margin: 0 0 10px; }
  /* A locked (answered, instant-feedback) question can't be changed, so its
     options drop the pointer and the green hover that suggests they're clickable. */
  .card.locked .opt { cursor: default; }
  .card.locked .opt:not(.fb-correct):not(.fb-wrong):hover { border-color: var(--border); }
  .opt.fb-correct { border-color: var(--good); background: #26d07c1f; }
  .opt.fb-wrong { border-color: var(--bad); background: #e0524d1a; }
  .fb-mark { font-weight: 800; font-size: 1rem; align-self: center; }
  .opt.fb-correct .fb-mark { color: var(--good); }
  .opt.fb-wrong .fb-mark { color: var(--bad); }

  /* Instant-feedback toggle */
  .fb-toggle {

  .switch {

  .domain-row { display: flex; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); }

  .review-item.skipped { border-left: 3px solid var(--text-dim); }

  .review-opt { padding: 8px 12px; border-radius: 8px; margin-bottom: 6px; font-size: 0.9rem; }

  /* Prep resources — right-hand panel on the start screen, stacked below on narrow screens */

    width: 320px; flex-shrink: 0; position: sticky; top: 20px;
    max-height: calc(100vh - 40px); overflow-y: auto;

  .pal-pct.ok { color: var(--good); }

  /* Fixed 6 columns that shrink with the panel; the padding keeps the current

  .pal-cell:hover { border-color: var(--lime); }

  .pal-cell.answered { background: var(--border); border-color: var(--text-dim); }
  .pal-cell.skipped { color: var(--text-dim); border-style: dashed; }
  .results-grid { grid-template-columns: repeat(auto-fill, minmax(42px, 1fr)); margin-bottom: 8px; }

  .pal-cell.flagged::after { content: '★'; position: absolute; top: -6px; right: -4px; font-size: 0.7rem; color: var(--amber); }
  /* Instant-feedback answer + explanation */
  .fb-panel { margin-top: 12px; padding: 12px 14px; border-radius: 10px; background: var(--surface-2); border-left: 3px solid var(--good); font-size: 0.86rem; line-height: 1.55; }

<body>
<div class="shell">
  <div class="wrap" id="app"></div>
  <aside class="prep" id="prep" hidden></aside>
  <div class="left-col">
    <aside class="explain-side" id="explainSide" hidden></aside>
  </div>
</div>
<!-- Leaderboard sits below the page content (it's secondary). On narrow screens
     .sidebar becomes the 🏆 slide-out drawer, which works from here too. -->
<div class="board-dock">
  <aside class="sidebar" id="board"></aside>
</div>
<button class="board-toggle" id="boardToggle" aria-label="Toggle leaderboard">🏆</button>
<div class="user-menu" id="userMenu" hidden>
  <button class="avatar" id="avatarBtn" aria-haspopup="menu" aria-expanded="false" aria-label="Account menu"></button>
  <div class="user-pop" id="userPop" role="menu" hidden>
    <div class="user-pop-head">
      <span class="user-pop-label">Signed in as</span>
      <span class="user-pop-name" id="userPopName"></span>
    </div>
    <button class="user-pop-item" id="menuHistory" role="menuitem">📊 My history</button>
    <button class="user-pop-item danger" id="menuSignOut" role="menuitem">↩ Sign out</button>
  </div>
</div>

<script>
// ========================= QUESTION BANK =========================
// Each level is a separate array. Add new levels as intel comes in.
// ===================== QUESTION BANKS =====================
// Levels live in questions/*.json so new banks can be added without touching
// this file: drop in questions/<name>.json and list it in questions/index.json.
// Note: this fetches, so the app must be served over HTTP — opening index.html
// directly from disk (file://) will not work. See README for local dev.
let LEVELS = {};
let RESOURCES = null;

// Prep links live in resources.json so they can be edited without touching code.
// Failure is non-fatal: the section is simply hidden.
async function loadResources() {
  try {
    const r = await fetch('./resources.json', { cache: 'no-store' });
    if (r.ok) RESOURCES = await r.json();
  } catch {}
}

async function loadLevels() {
  const manifest = await fetch('./questions/index.json', { cache: 'no-store' }).then(r => {
    if (!r.ok) throw new Error('questions/index.json returned ' + r.status);
    return r.json();
  });

  const names = Array.isArray(manifest.levels) ? manifest.levels : [];
  if (!names.length) throw new Error('questions/index.json lists no levels');

  const loaded = await Promise.all(names.map(async name => {
    const r = await fetch('./questions/' + name + '.json', { cache: 'no-store' });
    if (!r.ok) throw new Error('questions/' + name + '.json returned ' + r.status);
    return [name, await r.json()];
  }));

  LEVELS = {};
  loaded.forEach(([name, lv]) => {
    LEVELS[lv.key || name] = {
      name: lv.name || name,
      desc: lv.desc || '',
      ready: lv.ready !== false,
      requires: lv.requires || null,
      pool: Boolean(lv.pool),
      // Start-screen section ("path" = gated exam path, "bank" = mock exam bank),
      // and whether a pool level (Full Mock Exam) may draw from this bank.
      section: lv.section || 'path',
      inPool: lv.inPool !== false,
      count: lv.count,
      scenarioPick: lv.scenarioPick || null,
      scenarioWeights: lv.scenarioWeights || null,
      blueprint: lv.blueprint,
      questions: Array.isArray(lv.questions) ? lv.questions : []
    };
  });
}


const SECONDS_PER_QUESTION = 120; // real exam pace: 60 questions / 120 minutes
const FULL_EXAM_COUNT = 60;       // real exam length
const EXAM_DURATION = FULL_EXAM_COUNT * SECONDS_PER_QUESTION; // 120 minutes
const PASS_SCORE = 720; // out of 1000

// Duration for a given level = 2 minutes per question (real exam pace)
function durationFor(level) {
  const n = level.count || level.questions.length;
  return n * SECONDS_PER_QUESTION;
}

// Paper composition: a difficulty ramp. The paper opens with easy items, moves
// through medium, and finishes on hard ones.
const RAMP = [
  { d: 1, n: 15 },  // first 15: easy
  { d: 2, n: 20 },  // next 20: medium
  { d: 3, n: 25 }   // remaining 25: hard
];

// Build a paper of `n` questions following RAMP. Each tier is shuffled so papers
// still vary between sittings. If a tier is short in this bank, the shortfall is
// backfilled from the nearest tier that has spares, so the paper always reaches
// full length; the easy→medium→hard order of the final paper is preserved.
function buildRampedPaper(bank, n) {
  const pools = { 1: shuffle(bank.filter(q => (q.d || 2) === 1)),
                  2: shuffle(bank.filter(q => (q.d || 2) === 2)),
                  3: shuffle(bank.filter(q => (q.d || 2) === 3)) };

  // Split n across the tiers by largest remainder, so the quotas sum to exactly
  // n. Rounding each tier independently could overshoot and return n+1 items.
  const rampTotal = RAMP.reduce((a, b) => a + b.n, 0);
  const exact = RAMP.map(({ d, n: q }) => ({ d, want: n * q / rampTotal }));
  const quotas = {};
  exact.forEach(e => { quotas[e.d] = Math.floor(e.want); });
  let remainder = n - exact.reduce((a, e) => a + quotas[e.d], 0);
  exact.slice()
    .sort((a, b) => (b.want - Math.floor(b.want)) - (a.want - Math.floor(a.want)))
    .forEach(e => { if (remainder > 0) { quotas[e.d]++; remainder--; } });

  const picked = { 1: [], 2: [], 3: [] };

  // First pass: take up to quota from each tier.
  RAMP.forEach(({ d }) => {
    picked[d] = pools[d].splice(0, quotas[d]);
  });

  // Second pass: backfill any shortfall from whichever tier still has spares,
  // preferring the closest difficulty.
  const order = [1, 2, 3];
  let short = n - order.reduce((a, d) => a + picked[d].length, 0);
  while (short > 0) {
    const donor = [2, 3, 1].find(d => pools[d].length > 0);
    if (donor === undefined) break;         // bank smaller than the paper
    picked[donor].push(pools[donor].shift());
    short--;
  }

  return [...picked[1], ...picked[2], ...picked[3]];
}

// The six official exam scenarios. The real exam presents 4 of these, and every
// question sits inside one; a question's `scenario` field is the id below.
// Scenario 0 means the question is a standalone concept check with no narrative.
const SCENARIOS = {
  1: { name: 'Customer Support Resolution Agent',
       blurb: 'You are building a customer support resolution agent with the Claude Agent SDK. It handles returns, billing disputes, and account issues, reaching your backend through MCP tools (get_customer, lookup_order, process_refund, escalate_to_human). Target: 80%+ first-contact resolution, while knowing when to escalate.' },
  2: { name: 'Code Generation with Claude Code',
       blurb: 'Your team uses Claude Code for code generation, refactoring, debugging, and documentation. You are integrating it into the development workflow with custom slash commands and CLAUDE.md configuration, and deciding when to use plan mode over direct execution.' },
  3: { name: 'Multi-Agent Research System',
       blurb: 'You are building a multi-agent research system with the Claude Agent SDK. A coordinator delegates to specialised subagents: one searches the web, one analyses documents, one synthesises findings, one generates reports. The system produces comprehensive, cited reports.' },
  4: { name: 'Developer Productivity with Claude',
       blurb: 'You are building developer productivity tools with the Claude Agent SDK. The agent helps engineers explore unfamiliar codebases, understand legacy systems, generate boilerplate, and automate repetitive work, using built-in tools (Read, Write, Bash, Grep, Glob) and MCP servers.' },
  5: { name: 'Claude Code for Continuous Integration',
       blurb: 'You are integrating Claude Code into your CI/CD pipeline. It runs automated code reviews, generates test cases, and comments on pull requests. Your prompts need to give actionable feedback while minimising false positives.' },
  6: { name: 'Structured Data Extraction',
       blurb: 'You are building a structured data extraction system with Claude. It pulls information out of unstructured documents, validates against JSON schemas, and must stay accurate, handle edge cases gracefully, and feed downstream systems.' }
};

// Weighted pick of `k` distinct scenario ids. `weights` biases which scenarios
// get drawn (higher = likelier); unlisted scenarios default to 1.
function pickScenarios(available, k, weights = {}) {
  const pool = available.slice();
  const out = [];
  while (out.length < k && pool.length) {
    const total = pool.reduce((a, s) => a + (weights[s] || 1), 0);
    let r = Math.random() * total;
    let idx = pool.length - 1;
    for (let i = 0; i < pool.length; i++) {
      r -= (weights[pool[i]] || 1);
      if (r <= 0) { idx = i; break; }
    }
    out.push(pool.splice(idx, 1)[0]);
  }
  return out;
}

// Build a paper as scenario blocks, mirroring the real exam: a handful of
// scenarios, each contributing a run of consecutive questions under one shared
// context. Difficulty still ramps inside each block, and blocks are ordered
// easiest-first so the paper as a whole still opens gently.
function buildScenarioPaper(bank, n, { pick, weights }) {
  const byScenario = {};
  bank.forEach(q => {
    const s = q.scenario || 0;
    if (!s) return;                       // foundations items sit outside scenarios
    (byScenario[s] = byScenario[s] || []).push(q);
  });

  const available = Object.keys(byScenario).map(Number);
  if (!available.length) return buildRampedPaper(bank, n);

  const chosen = pickScenarios(available, Math.min(pick, available.length), weights);

  // If the chosen scenarios between them hold fewer questions than the paper
  // needs, pull in extra scenarios rather than shipping a short paper.
  const capacity = () => chosen.reduce((a, s) => a + byScenario[s].length, 0);
  const spare = available.filter(s => !chosen.includes(s));
  while (capacity() < n && spare.length) chosen.push(spare.shift());

  // Split n across the chosen scenarios, weighted the same way, but never asking
  // a scenario for more questions than it actually has.
  const wTotal = chosen.reduce((a, s) => a + (weights[s] || 1), 0);
  const quota = {};
  chosen.forEach(s => {
    quota[s] = Math.min(byScenario[s].length, Math.max(1, Math.round(n * (weights[s] || 1) / wTotal)));
  });

  // Reconcile rounding and shortfalls against the scenarios that still have spares.
  const sum = () => chosen.reduce((a, s) => a + quota[s], 0);
  let guard = 500;
  while (sum() !== n && guard-- > 0) {
    if (sum() < n) {
      const s = chosen.find(s => quota[s] < byScenario[s].length);
      if (s === undefined) break;
      quota[s]++;
    } else {
      const s = chosen.slice().reverse().find(s => quota[s] > 1);
      if (s === undefined) break;
      quota[s]--;
    }
  }

  const blocks = chosen
    .map(s => ({ scenario: s, questions: buildRampedPaper(byScenario[s], quota[s]) }))
    .filter(b => b.questions.length);

  // Order blocks by mean difficulty so the paper still ramps overall.
  blocks.sort((a, b) => mean(a.questions) - mean(b.questions));
  function mean(qs) { return qs.reduce((a, q) => a + (q.d || 2), 0) / (qs.length || 1); }

  return blocks.flatMap(b => b.questions);
}

// Build the question pool for a level.
//  - pool: true         → draw from every other level's bank (fresh paper each sitting)
//  - scenarioPick set   → draw that many scenarios and group their questions
//  - count set          → draw `count` from the bank
//  - otherwise          → use the whole bank
// In all cases difficulty ramps across the paper.
function buildQuestions(level) {
  let bank;
  if (level.pool) {
    bank = [];
    Object.values(LEVELS).forEach(lv => { if (!lv.pool && lv.inPool) bank.push(...lv.questions); });
  } else {
    bank = level.questions;
  }
  const n = Math.min(level.count || bank.length, bank.length);
  const raw = level.scenarioPick
    ? buildScenarioPaper(bank, n, { pick: level.scenarioPick, weights: level.scenarioWeights || {} })
    : buildRampedPaper(bank, n);
  return prepQuestions(raw, { keepOrder: true });
}

// ========================= STATE =========================
let state = {
  screen: 'start', // start | exam | paused | results
  level: null,
  questions: [],
  answers: [],
  struck: [],   // array of Sets
  flagged: [],
  current: 0,
  timeLeft: EXAM_DURATION,
  timerId: null,
  reviewFilter: 'all',
  instantFeedback: true
};

const app = document.getElementById('app');
const boardEl = document.getElementById('board');

// ===================== IDENTITY + LEADERBOARD =====================
// Name is remembered per browser so a teammate only types it once.
let user = { name: null };
const NAME_KEY = 'ccaf_name';

// The last name used on this browser outlives sign-out. Names must be unique on
// the leaderboard, so without this a Sign out would be a one-way door: your own
// name is on the board, the gate would reject it, and you could never sign back
// in. Remembering it here exempts *this browser* from that check while still
// stopping a different person from claiming the name.
const LAST_NAME_KEY = 'ccaf_last_name';

// Canonical form of a name — used both for the uniqueness check and for the
// per-name progress key, so "Jagtar Singh" and "jagtar  singh" are one person.
function normName(s) {
  return String(s || '').trim().toLowerCase().replace(/\s+/g, ' ');
}

function loadName() {
  try { return localStorage.getItem(NAME_KEY); } catch { return null; }
}
function saveName(n) {
  try {
    localStorage.setItem(NAME_KEY, n);
    localStorage.setItem(LAST_NAME_KEY, n);
  } catch {}
}
function loadLastName() {
  try { return localStorage.getItem(LAST_NAME_KEY); } catch { return null; }
}

// Sign out drops the active name but keeps completed levels — unlocks have
// always been per-browser rather than per-person, and clearing them would
// silently relock everyone who shares a machine.
function signOut() {
  try { localStorage.removeItem(NAME_KEY); } catch {}
  user.name = null;
  closeUserMenu();
  boardEl.innerHTML = '';
  renderNameGate(loadLastName());
  syncUserMenu();
}

// ---- Account menu (top-right) ------------------------------------------
// Hidden during exam/pause: swapping #app from here would tear down the question
// screen while the timer kept running.
const MENU_SCREENS = ['start', 'results', 'profile'];

function initials(name) {
  const parts = String(name || '').trim().split(/\s+/).filter(Boolean);
  if (!parts.length) return '?';
  return (parts[0][0] + (parts.length > 1 ? parts[parts.length - 1][0] : '')).toUpperCase();
}

function closeUserMenu() {
  document.getElementById('userMenu')?.classList.remove('open');
  document.getElementById('userPop')?.setAttribute('hidden', '');
  document.getElementById('avatarBtn')?.setAttribute('aria-expanded', 'false');
}

// Called after every screen transition, so the side/fixed chrome that lives
// outside #app stays in step with state.screen.
function syncUserMenu() {
  syncPrep();
  const menu = document.getElementById('userMenu');
  if (!menu) return;
  const show = Boolean(user.name) && MENU_SCREENS.includes(state.screen);
  menu.toggleAttribute('hidden', !show);
  if (!show) { closeUserMenu(); return; }
  document.getElementById('avatarBtn').textContent = initials(user.name);
  document.getElementById('userPopName').textContent = user.name;
  // "My history" is a no-op when it's already on screen.
  document.getElementById('menuHistory').disabled = state.screen === 'profile';
}

document.getElementById('avatarBtn')?.addEventListener('click', (e) => {
  e.stopPropagation();
  const menu = document.getElementById('userMenu');
  const open = menu.classList.toggle('open');
  document.getElementById('userPop').toggleAttribute('hidden', !open);
  document.getElementById('avatarBtn').setAttribute('aria-expanded', String(open));
});
document.getElementById('menuHistory')?.addEventListener('click', () => {
  closeUserMenu();
  renderProfile();
});
document.getElementById('menuSignOut')?.addEventListener('click', signOut);
document.addEventListener('click', (e) => {
  if (!e.target.closest('#userMenu')) closeUserMenu();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeUserMenu();
  // ←/→ move between questions during an exam — not while typing, and not
  // while a pause/confirm overlay is up.
  if ((e.key === 'ArrowLeft' || e.key === 'ArrowRight') && state.screen === 'exam'
      && !e.target.closest('input, textarea, select') && !document.querySelector('.overlay')) {
    e.preventDefault();
    goToQuestion(state.current + (e.key === 'ArrowRight' ? 1 : -1));
  }
});

// ---- Level progression -------------------------------------------------
// Levels can declare `requires: "<levelKey>"` in their JSON. That level stays
// locked until the required one has been completed, so people work through the
// foundations instead of jumping straight to the full mock.
// Progress is stored per name (`ccaf_completed:<name>`), not per browser. A
// shared key would hand the previous person's unlocks to whoever signs in next
// on the same machine, so signing out and in as someone else would skip levels.
const PROGRESS_KEY = 'ccaf_completed';

function progressKey(name = user.name) {
  return `${PROGRESS_KEY}:${normName(name)}`;
}

// One-time move of the pre-per-name key onto whoever is signed in when the app
// first loads after this change. It can only be attributed to one person, and
// the active name is the best available guess; afterwards the legacy key is gone
// so nobody else inherits it.
function adoptLegacyProgress() {
  if (!user.name) return;
  try {
    const legacy = localStorage.getItem(PROGRESS_KEY);
    if (!legacy) return;
    if (!localStorage.getItem(progressKey())) localStorage.setItem(progressKey(), legacy);
    localStorage.removeItem(PROGRESS_KEY);
  } catch {}
}

function loadProgress() {
  if (!user.name) return new Set();
  try { return new Set(JSON.parse(localStorage.getItem(progressKey()) || '[]')); }
  catch { return new Set(); }
}
function markCompleted(levelKey) {
  if (!user.name) return;
  try {
    const done = loadProgress();
    done.add(levelKey);
    localStorage.setItem(progressKey(), JSON.stringify([...done]));
  } catch {}
}
function isUnlocked(lv) {
  if (!lv.requires) return true;
  return loadProgress().has(lv.requires);
}

// Falls back to an in-memory board if the API isn't reachable (e.g. opened as a
// bare file rather than deployed), so the app never breaks.
let memoryBoard = [];
let boardCache = [];
// Whether boardCache came from the API — kept so anything that re-renders the
// board from cache (the profile screen) doesn't wrongly drop the offline notice.
let boardLive = false;

async function fetchBoard() {
  try {
    const r = await fetch('/api/scores', { cache: 'no-store' });
    if (!r.ok) throw new Error('bad status');
    const data = await r.json();
    boardCache = Array.isArray(data.scores) ? data.scores : [];
    boardLive = true;
    return { scores: boardCache, live: true };
  } catch {
    boardCache = memoryBoard;
    boardLive = false;
    return { scores: boardCache, live: false };
  }
}

async function submitScore(entry) {
  try {
    const r = await fetch('/api/scores', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(entry)
    });
    if (!r.ok) throw new Error('bad status');
  } catch {
    memoryBoard.push(entry);
  }
}

// Short exam code for leaderboard labels: initials of the level name, digits
// kept whole, anything after " · " dropped — "Scenario Practice" → "SP",
// "Mock Exam 4 · Hard" → "ME4". A one-word name keeps the whole word
// ("Foundations"), since a lone initial reads badly next to a name.
function examCode(levelName) {
  const base = String(levelName || '').split(' · ')[0].trim();
  const words = base.split(/\s+/).filter(Boolean);
  if (words.length === 1) return words[0];
  return words.map(w => /^\d+$/.test(w) ? w : w[0].toUpperCase()).join('');
}

function renderBoard(scores, live) {
  // One row per person *per exam*: their best score on that exam, with the
  // attempt count. A newer, lower attempt never hides an earlier best, and a
  // Foundations run no longer overwrites a Mock Exam run.
  const best = {};
  scores.forEach(s => {
    if (!s || !s.name) return;
    const key = s.name + '\u0000' + (s.level || '');
    const cur = best[key];
    if (!cur) best[key] = { ...s, attempts: 1 };
    else {
      cur.attempts++;
      if (s.score > cur.score || (s.score === cur.score && (s.at || 0) > (cur.at || 0)))
        best[key] = { ...s, attempts: cur.attempts };
    }
  });
  const ranked = Object.values(best).sort((a, b) => b.score - a.score || (b.at || 0) - (a.at || 0));

  const rows = ranked.length ? ranked.map((s, i) => {
    const code = examCode(s.level);
    const meta = [
      s.level && escapeHtml(s.level),
      s.total ? Math.round(s.score * s.total / 1000) + '/' + s.total + ' right' : '',
      s.attempts > 1 ? `best of ${s.attempts}` : ''
    ].filter(Boolean).join(' · ');
    return `
    <div class="lb-row ${s.name === user.name ? 'me' : ''}">
      <span class="lb-rank ${i < 3 ? 'top' : ''}">${i + 1}</span>
      <span class="lb-name" title="${escapeHtml(s.name)}${s.level ? ' — ' + escapeHtml(s.level) : ''}">${escapeHtml(s.name)}${code ? `<span class="lb-code">-${escapeHtml(code)}</span>` : ''}
        <span class="lb-meta">${meta}</span>
      </span>
      <span class="lb-score" style="color:${s.passed ? 'var(--good)' : 'var(--text-dim)'}">${s.score}<span style='font-size:0.66rem;color:var(--text-dim);font-weight:400'>/1000</span></span>
    </div>`;
  }).join('')
    : `<div class="lb-empty">No scores yet.<br>Finish an exam to appear here.</div>`;

  boardEl.innerHTML = `
    <h3>🏆 Team leaderboard</h3>
    <div class="lb-sub">Score out of 1000 · best per person per exam · pass ${PASS_SCORE}${live ? '' : ' · offline (this browser only)'}</div>
    ${rows}
  `;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

async function refreshBoard() {
  const { scores, live } = await fetchBoard();
  renderBoard(scores, live);
}

document.getElementById('boardToggle')?.addEventListener('click', () => {
  boardEl.classList.toggle('open');
});

// Names are the only identity this app has, so they must be unique on the board.
// Compared case- and whitespace-insensitively so "Jagtar Singh" can't shadow
// "jagtar  singh". `except` lets the change-name flow keep your own name.
function nameIsTaken(name, except = null) {
  const target = normName(name);
  if (except && normName(except) === target) return false;
  return boardCache.some(s => s && normName(s.name) === target);
}

// `keepName` is the caller's current name (change-name flow) — it stays valid so
// re-entering your own name isn't rejected as a duplicate of yourself.
function renderNameGate(keepName = null) {
  boardEl.innerHTML = '';
  app.innerHTML = `
    <div class="gate">
      <h1>CCAR-F <span>Exam Simulator</span></h1>
      <p>Enter your name to start. Your latest score appears on the team leaderboard, and your full attempt history stays on your profile.</p>
      <input id="nameInput" type="text" placeholder="Your name" maxlength="40" autocomplete="name" value="${escapeHtml(keepName || '')}">
      <div class="err" id="nameErr"></div>
      <button class="btn" id="nameGo" style="width:100%">Continue</button>
    </div>
  `;
  syncUserMenu();
  const input = document.getElementById('nameInput');
  const err = document.getElementById('nameErr');
  const go = async () => {
    const v = input.value.trim();
    if (v.length < 2) { err.textContent = 'Please enter at least 2 characters.'; return; }
    // The board may not have loaded yet on a cold start — fetch before deciding,
    // otherwise an empty cache would wave every duplicate through.
    err.textContent = 'Checking name…';
    await fetchBoard();
    if (nameIsTaken(v, keepName)) {
      err.textContent = `“${v}” is already taken on the leaderboard. Please pick a different name.`;
      input.focus();
      input.select();
      return;
    }
    err.textContent = '';
    user.name = v;
    saveName(v);
    adoptLegacyProgress();
    renderStart();
    refreshBoard();
  };
  document.getElementById('nameGo').addEventListener('click', go);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
  input.focus();
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function prepQuestions(raw, { keepOrder = false } = {}) {
  // Options are always shuffled so the correct answer never sits in a fixed slot.
  // Question order is preserved when the caller has already arranged it (the
  // difficulty ramp), otherwise it's shuffled.
  const list = keepOrder ? raw : shuffle(raw);
  // Authors write `correct` as one index, or an array of indices for a
  // multiple-response item. Internally it is always a sorted index array into
  // the shuffled options, and `multi` records which kind the author wrote.
  return list.map(q => {
    const multi = Array.isArray(q.correct);
    const correctTexts = (multi ? q.correct : [q.correct]).map(i => q.options[i]);
    const opts = shuffle(q.options);
    const correct = correctTexts.map(t => opts.indexOf(t)).sort((a, b) => a - b);
    return { ...q, options: opts, multi, correct };
  });
}

// An answer is null (untouched) or an array of chosen option indices.
// A multiple-response item counts as answered only once the stated number of
// options is chosen, and scores only if every chosen option is correct — no
// partial credit, matching how the real exam marks these items.
function isAnswered(q, ans) {
  return Array.isArray(ans) && ans.length === q.correct.length;
}
function isRight(q, ans) {
  return isAnswered(q, ans) && q.correct.every(i => ans.includes(i));
}
function unansweredCount() {
  return state.questions.filter((q, i) => !isAnswered(q, state.answers[i])).length;
}

function fmtTime(s) {
  const m = Math.floor(s / 60);
  const sec = s % 60;
  return `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
}

// ========================= TIMER =========================
function startTimer() {
  stopTimer();
  state.timerId = setInterval(() => {
    state.timeLeft--;
    updateTimerDisplay();
    if (state.timeLeft <= 0) { finishExam(); }
  }, 1000);
}
function stopTimer() { if (state.timerId) { clearInterval(state.timerId); state.timerId = null; } }
function updateTimerDisplay() {
  const el = document.getElementById('timer');
  if (!el) return;
  el.textContent = fmtTime(state.timeLeft);
  el.className = 'timer' + (state.timeLeft <= 300 ? ' danger' : state.timeLeft <= 900 ? ' warn' : '');
}

// ========================= SCREENS =========================
// In-app confirmation dialog. Native confirm() is blocked in sandboxed
// iframes and silently returns false, so buttons appear dead — this replaces it.
function showConfirm({ title, body, confirmLabel = 'Confirm', cancelLabel = 'Cancel', onConfirm, onCancel }) {
  document.getElementById('confirmOverlay')?.remove();
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.id = 'confirmOverlay';
  ov.innerHTML = `
    <div class="overlay-card" style="max-width:420px">
      <h2 style="font-size:1.3rem">${title}</h2>
      <p>${body}</p>
      <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
        <button class="btn ghost" id="cfCancel">${cancelLabel}</button>
        <button class="btn" id="cfOk">${confirmLabel}</button>
      </div>
    </div>`;
  document.body.appendChild(ov);
  const close = () => ov.remove();
  document.getElementById('cfOk').addEventListener('click', () => { close(); onConfirm && onConfirm(); });
  document.getElementById('cfCancel').addEventListener('click', () => { close(); onCancel && onCancel(); });
}

// Official exam questions sit inside a named scenario. If a question carries a
// "SCENARIO — ... ." prefix, render it as a context banner above the question body.
function formatQuestion(text) {
  const m = text.match(/^SCENARIO — ([^.]+)\.\s*([\s\S]+)$/);
  if (!m) return text;
  return `<div class="scenario-banner">Scenario · ${m[1]}</div>${m[2]}`;
}

// Questions are drawn in scenario blocks. The first question of a block carries
// the full context; the rest get a compact reminder of which scenario they're in.
// `index` is the question's position in the current paper.
function scenarioHeader(q, index) {
  const s = SCENARIOS[q.scenario];
  if (!s) return '';
  // On an ungrouped level consecutive questions rarely share a scenario, so the
  // full context would reappear on almost every question. Show the compact tag.
  if (!state.grouped) return `<div class="scenario-banner">Scenario · ${s.name}</div>`;
  const prev = index > 0 ? state.questions[index - 1] : null;
  const isFirst = !prev || prev.scenario !== q.scenario;
  if (!isFirst) return `<div class="scenario-banner">Scenario · ${s.name}</div>`;
  return `<div class="scenario-intro">
      <div class="scenario-intro-label">Scenario · ${s.name}</div>
      <p>${s.blurb}</p>
    </div>`;
}

function resetToMenu() {
  stopTimer();
  // remove any lingering overlays
  document.getElementById('pauseOverlay')?.remove();
  document.getElementById('confirmOverlay')?.remove();
  // fully reset exam state
  state.screen = 'start';
  state.level = null;
  state.questions = [];
  state.answers = [];
  state.struck = [];
  state.flagged = [];
  state.current = 0;
  state.timeLeft = EXAM_DURATION;
  state.totalTime = EXAM_DURATION;
  state.reviewFilter = 'all';
  renderStart();
}

// "3 days ago" from an epoch ms stamp. Entries predating the `at` field show nothing.
function relativeTime(at) {
  if (!at) return '';
  const secs = Math.max(0, Math.round((Date.now() - at) / 1000));
  const units = [[60, 'second'], [60, 'minute'], [24, 'hour'], [7, 'day'], [4.35, 'week'], [12, 'month']];
  let n = secs, label = 'second';
  for (const [step, next] of units) {
    if (n < step) break;
    n = n / step; label = next;
  }
  n = Math.floor(n);
  if (label === 'second' && n < 5) return 'just now';
  return `${n} ${label}${n === 1 ? '' : 's'} ago`;
}

// Read-only history for the signed-in name, drawn from the board payload we
// already fetched. Offline, this shows only the attempts made in this browser.
function renderProfile() {
  state.screen = 'profile';
  const mine = boardCache
    .filter(s => s && s.name === user.name)
    .sort((a, b) => (b.at || 0) - (a.at || 0));

  const scores = mine.map(s => s.score);
  const best = scores.length ? Math.max(...scores) : 0;
  const passes = mine.filter(s => s.passed).length;

  const attempts = mine.length ? mine.map(s => {
    const right = s.total ? Math.round(s.score * s.total / 1000) + '/' + s.total + ' right' : '';
    const when = relativeTime(s.at);
    return `
    <div class="attempt">
      <div class="attempt-main">
        <div class="attempt-level">${escapeHtml(s.level || 'Unknown level')}</div>
        <div class="attempt-meta">${[right, when].filter(Boolean).join(' · ')}</div>
      </div>
      <div class="attempt-badge ${s.passed ? 'pass' : 'fail'}">${s.passed ? 'Passed' : 'Failed'}</div>
      <div class="attempt-score" style="color:${s.passed ? 'var(--good)' : 'var(--text-dim)'}">${s.score}</div>
    </div>`;
  }).join('')
    : `<div class="lb-empty">No attempts recorded yet.<br>Finish a level and it will show up here.</div>`;

  app.innerHTML = `
    <div class="profile-head">
      <div>
        <div class="section-label" style="margin:0">My profile</div>
        <h2 style="font-family:var(--font-display);font-size:1.5rem;margin-top:4px">${escapeHtml(user.name || '—')}</h2>
      </div>
      <button class="btn ghost" id="profileBack">← Back to levels</button>
    </div>
    <div class="profile-stats">
      <div class="profile-stat"><div class="num">${mine.length}</div><div class="lbl">Attempts</div></div>
      <div class="profile-stat"><div class="num">${best}</div><div class="lbl">Best score</div></div>
      <div class="profile-stat"><div class="num">${mine.length ? mine[0].score : 0}</div><div class="lbl">Latest score</div></div>
      <div class="profile-stat"><div class="num">${passes}</div><div class="lbl">Passed</div></div>
    </div>
    <div class="section-label">Attempt history · newest first</div>
    ${attempts}
  `;

  document.getElementById('profileBack').addEventListener('click', () => {
    state.screen = 'start';
    renderStart();
    refreshBoard();
  });

  syncUserMenu();
}

function renderResources() {
  const chr39 = String.fromCharCode(39);
  if (!RESOURCES || !Array.isArray(RESOURCES.groups)) return '';
  const groups = RESOURCES.groups.map(g => {
    const items = (g.items || []).map(it =>
      '<a class=' + chr39 + 'res-item' + chr39 + ' href=' + chr39 + escapeHtml(it.url || '') + chr39 +
      ' target=' + chr39 + '_blank' + chr39 + ' rel=' + chr39 + 'noopener' + chr39 + '>' +
      '<span class=' + chr39 + 'res-name' + chr39 + '>' + escapeHtml(it.name || '') + '</span>' +
      '<span class=' + chr39 + 'res-note' + chr39 + '>' + escapeHtml(it.note || '') + '</span></a>'
    ).join('');
    return '<div class=' + chr39 + 'res-group' + chr39 + '><div class=' + chr39 + 'res-title' + chr39 + '>' +
      escapeHtml(g.title || '') + '</div>' + items + '</div>';
  }).join('');
  const plan = Array.isArray(RESOURCES.plan) && RESOURCES.plan.length
    ? '<ol class=' + chr39 + 'res-plan' + chr39 + '>' + RESOURCES.plan.map(x => '<li>' + escapeHtml(x) + '</li>').join('') + '</ol>'
    : '';
  return '<div class=' + chr39 + 'section-label' + chr39 + '>How to prepare</div>' +
    plan + '<div class=' + chr39 + 'res-wrap' + chr39 + '>' + groups + '</div>';
}

// The prep panel is the right-hand column of the shell, so it lives outside #app
// and is synced on every screen transition rather than rendered into the page.
// During an exam it holds the question palette; on other screens it is empty and
// hidden. It also stamps body[data-screen] for screen-specific layout.
function syncPrep() {
  const panel = document.getElementById('prep');
  if (!panel) return;
  if (!panel.dataset.wired) {
    panel.dataset.wired = '1';
    panel.addEventListener('click', (e) => {
      const cell = e.target.closest('[data-jump]');
      if (!cell || state.screen !== 'exam') return;
      state.current = parseInt(cell.dataset.jump);
      renderExam();
    });
  }
  // CSS keys the layout off this: the left column only exists during an exam,
  // and the start screen gets a wider main column.
  document.body.dataset.screen = state.screen;
  // Right panel: the question palette during an exam, nothing otherwise
  // (How to prepare is its own screen now — renderPrepPage()).
  const html = (state.screen === 'exam' || state.screen === 'paused') ? renderPalette() : '';
  panel.innerHTML = html;
  panel.toggleAttribute('hidden', !html);
  // The left-column explanation belongs to the exam screen only.
  const side = document.getElementById('explainSide');
  if (side && state.screen !== 'exam' && state.screen !== 'paused') { side.innerHTML = ''; side.hidden = true; }
}

function renderStart() {
  stopTimer();
  state.screen = 'start';
  const scenarioColors = ['#26d07c','#3b9ae1','#f0a828','#a678e2','#e0524d','#20c4b8'];
  // Compact card: everything the picker needs in a few lines, so every exam fits
  // on one screen. The full description sits in the tooltip.
  const levelCard = ([key, lv], i) => {
    const unlocked = isUnlocked(lv);
    const available = lv.ready && unlocked;
    const requiredName = lv.requires && LEVELS[lv.requires] ? LEVELS[lv.requires].name : lv.requires;
    let badge, badgeClass;
    if (!lv.ready) { badge = 'Soon'; badgeClass = 'badge-soon'; }
    else if (!unlocked) { badge = '🔒 Locked'; badgeClass = 'badge-soon'; }
    else { badge = (lv.count || lv.questions.length) + ' Qs · ' + Math.round(durationFor(lv)/60) + ' min'; badgeClass = 'badge-ready'; }
    let meta = '';
    if (!unlocked && lv.ready) {
      meta = `Finish <b>${escapeHtml(requiredName || '')}</b> to unlock`;
    } else if (available) {
      const bank = lv.pool ? Object.values(LEVELS).filter(x => !x.pool && x.inPool).flatMap(x => x.questions) : lv.questions;
      const n = Math.min(lv.count || bank.length, bank.length);
      const c = { 1: 0, 2: 0, 3: 0 };
      buildRampedPaper(bank, n).forEach(q => c[q.d || 2]++);
      const ramp = [c[1] && `${c[1]} easy`, c[2] && `${c[2]} medium`, c[3] && `${c[3]} hard`].filter(Boolean).join(' · ');
      meta = (bank.length > n ? `Fresh draw from ${bank.length} · ` : '') + ramp;

  const entries = Object.entries(LEVELS);
  const pathCards = entries.filter(([, lv]) => lv.section !== 'bank').map(levelCard).join('');
  const bankCards = entries.filter(([, lv]) => lv.section === 'bank').map(levelCard).join('');

  app.innerHTML = `

        </div>
      </div>
      ${RESOURCES ? `<button class="btn ghost prep-link" id="prepLink">📚 How to prepare</button>` : ''}
    </div>
    <button class="fb-toggle compact" id="fbToggle">

        <span class="fb-d">${state.instantFeedback
          ? ' — answers are marked straight away with the correct answer and explanation; first pick is final.'
          : ' — real exam conditions; results only at the end.'}</span>
        <span class="fb-note">Every exam here runs at the real pace of 2 min per question, and the timer can be paused.</span></span>
      <span class="switch ${state.instantFeedback ? 'on' : ''}"></span>

    <div class="sec-head">

    </div>
    <div class="levels path">${pathCards}</div>
    ${bankCards ? `
    <div class="sec-head">
      <div class="sec-title">Mock Exam Bank</div>
      <div class="sec-sub">Complete practice exams, always unlocked — or build a quiz on the domains you want to drill.</div>
    </div>
    <div class="bank-split">
      <div class="levels bank">${bankCards}</div>
      ${renderBuilder()}
    </div>` : ''}
    <p class="start-foot">Taking this as <b>${escapeHtml(user.name || '—')}</b> · <a href="#" id="changeName">change name</a></p>
  `;

  app.querySelectorAll('.level-card:not(:disabled)').forEach(btn => {
    btn.addEventListener('click', () => beginExam(btn.dataset.level));
  });
  wireBuilder();
  document.getElementById('fbToggle')?.addEventListener('click', () => {
    state.instantFeedback = !state.instantFeedback;
    renderStart();
  });
  document.getElementById('prepLink')?.addEventListener('click', renderPrepPage);
  document.getElementById('changeName')?.addEventListener('click', (e) => {
    e.preventDefault();

}
