      { domain: "Claude Code", d: 2, q: "You want a custom /review slash command available to every developer automatically when they clone or pull the repo. Where do you put it?", options: ["~/.claude/commands/review.md in each developer's home directory","In .claude/commands/ in the project repository (version-controlled)","In the root CLAUDE.md file","In a .claude/config.json commands array"], correct: 1, explain: "Project-scoped commands in .claude/commands/ are version-controlled and auto-available to everyone on clone/pull. User-level (~/.claude/commands/) isn't shared. CLAUDE.md is for context, not command definitions. The config.json commands array doesn't exist." },
      { domain: "Claude Code", d: 2, q: "Test files are spread throughout the codebase (e.g., Button.test.tsx next to Button.tsx) and you want all tests to follow the same conventions regardless of location, applied automatically. Best mechanism?", options: [".claude/rules/ files with YAML frontmatter glob patterns (e.g., paths: ['**/*.test.tsx'])","One big root CLAUDE.md with a section per area, relying on Claude to infer which applies","A skill per code type with conventions in SKILL.md","A separate CLAUDE.md in every subdirectory"], correct: 0, explain: "Path-scoped rules in .claude/rules/ with glob patterns load automatically when editing matching files regardless of directory — ideal for scattered test files. CLAUDE.md inference is unreliable; skills need manual invocation; per-directory CLAUDE.md can't handle files spread everywhere." },
      { domain: "Claude Code", d: 2, q: "A skill produces very verbose codebase-analysis output that pollutes the main conversation context. Which frontmatter option fixes this?", options: ["allowed-tools","context: fork — runs the skill in an isolated sub-agent context so its output doesn't pollute the main session","argument-hint","description"], correct: 1, explain: "context: fork runs a skill in an isolated sub-agent context, keeping verbose or exploratory output out of the main conversation. allowed-tools restricts tools; argument-hint prompts for parameters; description is metadata." },
      { domain: "Claude Code", d: 3, q: "A new team member reports they're not getting the coding-standard instructions everyone else follows. The rules were placed in ~/.claude/CLAUDE.md by another dev. What's the diagnosis?", options: ["The new member needs to restart Claude Code","User-level (~/.claude/CLAUDE.md) settings aren't shared via version control — the rules must be at project level (.claude/CLAUDE.md or root) to reach teammates","CLAUDE.md files don't support coding standards","They need to run /compact"], correct: 1, explain: "User-level CLAUDE.md applies only to that user and isn't shared via version control. Team-wide standards belong at project level so they reach everyone on clone/pull. Use /memory to verify which files are loaded." },
      { domain: "Prompt Eng", d: 2, q: "An extraction schema marks shipping_date as required, but some source documents genuinely lack a shipping date, and Claude keeps fabricating plausible dates. Best fix?", options: ["Add a few-shot example telling it to guess conservatively","Make the field nullable/optional so 'not present' is representable — the model no longer needs to fabricate a value to satisfy a required field","Lower temperature to 0","Increase max_tokens"], correct: 1, explain: "Forcing a required field when the info may be absent pushes the model to hallucinate. Nullable/optional fields let 'absent' be a valid output. Retries and temperature changes can't conjure information that isn't in the source." },
      { domain: "Prompt Eng", d: 3, q: "Your automated Claude Code review in CI posts many false positives, eroding developer trust. Which approach most effectively improves precision?", options: ["Add 'be conservative' and 'only report high-confidence findings' to the prompt","Write explicit categorical criteria defining exactly which issues to report (bugs, security) versus skip (minor style), with concrete examples per severity","Lower the temperature to 0","Have the model self-rate confidence and hide low-confidence findings"], correct: 1, explain: "Vague instructions like 'be conservative' don't improve precision. Explicit categorical criteria with concrete examples produce consistent classification. Self-reported confidence is poorly calibrated. You can also temporarily disable high-false-positive categories to restore trust while refining them." },
      { domain: "Prompt Eng", d: 2, q: "You have several extraction tools (one per document type) and the document type is unknown ahead of time, but you must guarantee Claude calls one of them rather than replying with text. Which tool_choice setting?", options: ["tool_choice: 'auto' with a prompt saying 'please use a tool'","tool_choice: 'any' — guarantees a tool call while letting the model choose which schema fits","tool_choice: 'none'","Forced single tool: {type:'tool', name:'extract_x'}"], correct: 1, explain: "tool_choice 'any' guarantees a tool call but lets the model pick which — right when the document type is unknown. 'auto' can still return text. 'none' forbids tools. Forcing one specific tool is wrong when you don't know the type in advance." },
      { domain: "Context Mgmt", d: 3, q: "SCENARIO — Customer Support Resolution Agent. Claude's answer quality degrades on important details (amounts, dates, order numbers) buried in the middle of a long conversation. What's the best mitigation?", options: ["Keep appending everything so nothing is lost","Extract transactional facts (amounts, dates, order numbers, statuses) into a persistent 'case facts' block included in each prompt, outside the summarized history, and place key info at the start/end","Lower temperature","Switch to stdio transport"], correct: 1, explain: "The 'lost in the middle' effect means models attend less reliably to the middle of long inputs. Persisting a structured 'case facts' block in every prompt and positioning key info at the start/end preserves critical values that progressive summarization would otherwise blur." },
      { domain: "Context Mgmt", d: 3, q: "SCENARIO — Multi-Agent Research System. While Claude synthesises findings from multiple sources, two credible sources report conflicting revenue figures ($4M vs $6M). How should the synthesis handle this?", options: ["Pick the higher figure since it's more recent","Average them to $5M","Annotate the conflict with source attribution for each value rather than arbitrarily selecting one, preserving claim-source mappings","Drop both figures to avoid confusion"], correct: 2, explain: "Conflicting values from credible sources should be annotated with their source attribution, not silently resolved. Preserving claim-source mappings (and publication dates) lets the reader or coordinator judge — averaging or arbitrary selection destroys the provenance needed to resolve correctly." },
      { domain: "Context Mgmt", d: 2, q: "During a long codebase-exploration session, the agent starts giving inconsistent answers and referencing 'typical patterns' instead of the specific classes it found earlier. Best countermeasure?", options: ["Keep going — the model will self-correct","Have the agent maintain a scratchpad file recording key findings and reference it for later questions, and use /compact when context fills with verbose discovery","Restart from scratch every 10 minutes","Raise max_tokens"], correct: 1, explain: "Context degradation in extended sessions makes models drift toward generic 'typical patterns.' Scratchpad files persist key findings across context boundaries, and /compact reduces bloat from verbose discovery — both counteract degradation without losing what was learned." },
      { domain: "Agentic Arch", d: 3, q: "An unattended Agent SDK job in production occasionally runs for hours and burns a large bill before anyone notices. Which combination best bounds it?", options: ["Lower the temperature and shorten the system prompt","Set max_turns and max_budget_usd so the loop has hard termination ceilings, and read total_cost_usd off each ResultMessage for observability","Rely on the model deciding to stop when the task is done","Run it in bypassPermissions so it finishes faster"], correct: 1, explain: "The loop ends when the model returns no tool calls, max_turns is hit, the max_budget_usd ceiling trips, or context forces compaction. For unattended work you want the explicit ceilings plus cost telemetry — hoping the model stops on its own is not a control." },
      { domain: "Agentic Arch", d: 3, q: "A long orchestrator session gets progressively more expensive per turn even though individual tasks stay the same size. What explains this, and what's the mitigation?", options: ["The model degrades over time and needs a restart to restore pricing","Every call carries the full conversation history plus all subagent descriptions, so cost grows with session length — cap it with max_turns, cheaper models for subagents, and session resets","Subagent transcripts are billed twice by design","Token prices increase during long sessions"], correct: 1, explain: "The orchestrator re-sends accumulated history and all subagent descriptions on every call, so cost compounds with session length. Mitigate with turn caps, routing subagents to cheaper models, and resetting the session once context stops earning its keep." },
      { domain: "Agentic Arch", d: 2, q: "A subagent was partway through a long analysis when the orchestrator's context was compacted. You need to continue that subagent's work rather than restart it. What's true?", options: ["The subagent's work is lost — compaction discards subagent state","Subagent transcripts persist independently of the main conversation and survive its compaction; the Agent tool result carries an agentId you can resume against","You must re-run the whole orchestration from the first turn","Only the final summary survives, never the working transcript"], correct: 1, explain: "Subagent transcripts are stored separately and outlive main-conversation compaction. The Agent tool result includes an agentId — resume the session and reference it to pick up where the subagent stopped (transcripts are cleaned up after cleanupPeriodDays, 30 by default)." },
      { domain: "Agentic Arch", d: 2, q: "Why is plan mode implemented using a separate read-only Plan subagent rather than letting the main session explore directly, and why does ExitPlanMode require permission?", options: ["Purely a performance optimisation with no architectural significance","The read-only Plan subagent handles research while preventing infinite subagent nesting, and requiring permission on ExitPlanMode makes the planning-to-execution transition an explicit, enforced confirmation step","Because plan mode runs on a different API endpoint","To allow plan mode to write files safely"], correct: 1, explain: "The read-only Plan subagent both isolates research and avoids the nesting problem that would arise if the main session spawned subagents that spawn more. Gating ExitPlanMode behind permission means moving from planning to editing is a deliberate, permission-enforced boundary — not something the model can slip past." },
      { domain: "Agentic Arch", d: 2, q: "A job needs hundreds of coordinated agents rather than a handful of delegations per turn. Using the Task tool from the orchestrator becomes unmanageable. What's the appropriate mechanism?", options: ["Raise max_turns and keep using Task delegation","Use the TypeScript SDK's Workflow tool, which moves orchestration into a script running outside the conversation context","Give each subagent the Task tool so they can subdivide further","Run hundreds of separate CLI processes and merge output manually"], correct: 1, explain: "Task delegation suits a few sub-conversations per turn. At the scale of dozens-to-hundreds of coordinated agents, the Workflow tool lifts orchestration out of the conversation context entirely — subagents still can't nest, so pushing Task down to them isn't an option." },
      { domain: "Claude Code", d: 2, q: "A team sets defaultMode: 'auto' in .claude/settings.json so everyone gets auto mode on clone. It has no effect for anyone. What's the explanation?", options: ["auto mode was removed from Claude Code","auto mode is ignored when set in project or local settings — it must come from user or managed settings","The key should be permissionMode, not defaultMode","They need to restart their machines for it to apply"], correct: 1, explain: "As of recent versions, auto mode is deliberately ignored from project or local settings; it only takes effect from user or managed settings. This trips up teams trying to standardise it via committed project config." },
      { domain: "Claude Code", d: 2, q: "You want a hard definition-of-done gate: Claude must not end its turn until the test suite passes. Which hook and mechanism?", options: ["A PostToolUse hook that runs the tests and logs failures","A Stop hook that runs the tests and exits 2 (or returns decision 'block') to refuse the turn ending and send control back to the model with a reason","A PreToolUse hook matched to Bash","A SessionEnd hook that reports the result afterwards"], correct: 1, explain: "The Stop event fires when the model finishes responding and is one of the blocking-capable events: exit 2 (or decision 'block') prevents the turn from ending and feeds the reason back, forcing Claude to keep working. PostToolUse can only observe; SessionEnd is far too late." },
      { domain: "Claude Code", d: 2, q: "A developer runs `claude` from /tmp while working on a repo elsewhere and reports that none of the project's MCP servers or project settings load. What's the cause?", options: ["A corrupt ~/.claude.json that needs deleting","Project-scope configuration resolves relative to the working directory — Claude Code must be launched from the repo root or a subdirectory for .mcp.json and project settings to load","MCP servers require an explicit --scope flag on every session","Project settings only load after the first tool call"], correct: 1, explain: "Project-scope discovery is directory-based. Launch from outside the repo and .mcp.json plus .claude/settings.json simply aren't found, even though they exist on disk. This is a common 'it works for everyone but me' diagnosis." },
      { domain: "Claude Code", d: 2, q: "You want to trial a new hook on your own machine before proposing it to the team, without affecting teammates or committing anything. Where does it go?", options: [".claude/settings.json in the project so it's testable in context","~/.claude/settings.json so it applies to all your projects"," .claude/settings.local.json — project-scoped to this repo, higher precedence than project settings, and gitignored so teammates are unaffected","managed-settings.json so it's enforced consistently"], correct: 2, explain: "settings.local.json is the experimentation layer: it sits above project settings in precedence, stays scoped to this repo, and Claude Code gitignores it automatically. Project settings would push the untested hook onto teammates; managed settings is for enforced org policy." },
      { domain: "Structured Output", d: 2, q: "A programmatic consumer needs machine-readable results from an Agent SDK run, not prose. What's the correct mechanism?", options: ["Ask the model in the prompt to end with a JSON block and regex it out of the text","Pass a JSON Schema as outputFormat and read the structured_output field from the result","Set temperature to 0 so the prose format becomes predictable","Parse the ResultMessage's cost fields"], correct: 1, explain: "The SDK supports outputFormat with a JSON Schema, exposing the parsed result as structured_output. Prompting for a JSON block and regexing the prose is the brittle prototype approach that breaks under drift." },
      { domain: "Structured Output", d: 2, q: "A Claude extraction pipeline validates every tool_use response against its JSON Schema and all responses pass, yet downstream reports contain wrong figures. What kind of validation is missing?", options: ["Nothing — schema validation is sufficient by definition","Semantic validation: the schema confirms shape and types, not that the source actually supports the values. Add business-rule checks (cross-field maths, provenance) and route mismatches to review","Stricter type coercion in the schema","A larger model"], correct: 1, explain: "Structure and semantics are different guarantees. A schema can confirm total is a number; it cannot confirm the document said that number or that line items sum to it. Production pipelines need business-rule validation layered on top of schema validation." },
      { domain: "Prompt Eng", d: 2, q: "You must extract from exactly one known document type and want to eliminate any chance the model picks a different tool or replies conversationally. Which tool_choice setting?", options: ["tool_choice: 'auto' with a firmly worded prompt","tool_choice: 'any' so it must call some tool","A forced single tool: {type: 'tool', name: 'extract_invoice'} — removing both the text-response path and the tool-selection decision","tool_choice: 'none' with schema instructions in the prompt"], correct: 2, explain: "When the type is known, forcing the specific tool removes two failure modes at once: conversational replies and wrong-tool selection. 'any' is right only when the type is unknown and the model must choose; 'auto' can still emit text." },
      { domain: "Prompt Eng", d: 2, q: "A Claude reviewer agent's findings vary run to run on identical input — sometimes flagging a pattern, sometimes not. Which change most improves consistency?", options: ["Run it three times and report only findings appearing twice","Replace subjective instructions with explicit categorical criteria and severity definitions, with concrete examples of what belongs in each category","Increase max_tokens so it has room to be thorough","Raise temperature so it explores more possibilities"], correct: 1, explain: "Inconsistency usually traces to underspecified criteria, not sampling. Explicit categories with worked examples give the model a deterministic rubric. Consensus-of-three (A) suppresses genuine intermittently-caught bugs rather than fixing the rubric." },
      { domain: "Tool Design", d: 2, q: "After connecting a database MCP server, sessions start hitting context limits quickly and Claude warns about oversized tool output. What's the right response?", options: ["Increase the context window and continue","Narrow what the tool returns (specific fields, row limits, pagination) — a chatty server burns the context you needed for the task, and output is capped anyway","Disable the warning","Move the server from project to user scope"], correct: 1, explain: "MCP output is warned about around 10,000 tokens and hard-capped by default near 25,000. Beyond the cap you lose data; below it you still lose working context. The fix is tool-side: return scoped fields and paginate rather than dumping wide result sets." },
      { domain: "Tool Design", d: 2, q: "A team's .mcp.json is committed to a public repo and includes an Authorization header for a remote server. What's the correct remediation?", options: ["Leave it — .mcp.json is only read locally","Rotate the leaked credential, then keep secrets out of the committed file by using environment-variable expansion in .mcp.json, or move the sensitive server to local/user scope","Rename the file to .mcp.local.json","Encrypt the repository"], correct: 1, explain: "A committed .mcp.json is as public as the repo. Rotate first — the secret is already exposed — then reference credentials via env-var expansion, or keep genuinely sensitive servers in local/user scope which live in ~/.claude.json and are never committed." },
      { domain: "Tool Design", d: 2, q: "Connection errors appear on a remote MCP server configured with --transport sse. What's the current guidance?", options: ["Add retry logic around the SSE connection","SSE is deprecated in favour of streamable HTTP — switch to --transport http","Downgrade to stdio and run the server locally","Increase MCP_TOOL_TIMEOUT and retry"], correct: 1, explain: "SSE has been deprecated in favour of streamable HTTP for remote MCP servers. Switching the transport to http is the fix rather than papering over connection failures with retries." },
      { domain: "Context Mgmt", d: 3, q: "After automatic compaction in a long Agent SDK session, an agent starts violating project conventions it had been following. Why does this happen and what handles it?", options: ["Compaction corrupts the system prompt permanently","Compaction summarises older messages and can blur instruction detail — the SDK re-reads CLAUDE.md instruction files after compacting, so durable conventions belong in CLAUDE.md rather than only in an early conversational turn","Conventions must be repeated in every user message","Compaction should be disabled in all production agents"], correct: 1, explain: "Instructions given once in an early turn can be summarised away. Because CLAUDE.md is re-read after compaction, durable conventions survive there — and anything that must never be violated belongs in a hook, not in prose at all." },
      { domain: "Context Mgmt", d: 2, q: "A coordinator must decide what a research subagent returns. The subagent produced 25,000 tokens of exploration to reach four conclusions. What should cross the boundary?", options: ["The full transcript, so the coordinator can audit the reasoning","Only a distilled structured result — the four conclusions in a defined schema with source attribution — since the raw transcript persists separately if it's ever needed for audit","A truncated first 5,000 tokens","A model-written prose summary with no schema"], correct: 1, explain: "Handoffs should pass distilled, schema-shaped results, keeping the coordinator's context lean. The audit trail isn't lost: subagent transcripts persist independently and can be resumed or inspected via their agentId." },
      { domain: "Agentic Arch", d: 2, q: "A Claude research agent must fetch three independent data sources before it can synthesise. Latency is dominated by round trips. What's the correct architectural response?", options: ["Spawn three subagents so each fetch runs in its own context","Configure the agentic loop so Claude emits multiple tool calls within a single response turn, letting the independent fetches execute in parallel before results are returned together","Increase max_turns so the sequential fetches have room to finish","Merge the three sources into one larger tool that fetches everything"], correct: 1, explain: "Independent subtasks with no data dependency between them should be issued as multiple tool calls in one response turn, so they execute in parallel and collapse three round trips into one. Subagents add spawn overhead and context transfer for what is really a batching problem." },
      { domain: "Agentic Arch", d: 2, q: "Your loop executes tool calls one at a time even when Claude returns several tool_use blocks in a single response. What's the consequence and the fix?", options: ["No consequence — tools must always run sequentially","You lose the parallelism Claude already offered: execute all tool_use blocks from that turn concurrently and return all tool_result blocks together in the next message","You should reject multi-tool responses and ask Claude to pick one","Set tool_choice to 'any' to force single-tool responses"], correct: 1, explain: "When Claude emits multiple tool_use blocks in one turn it has already determined those calls are independent. Running them serially throws away the latency win. Execute them concurrently and return all corresponding tool_result blocks in the same follow-up message." },
      { domain: "Multi-Agent", d: 2, q: "You're writing delegation instructions for a research subagent. Which approach best balances adaptive behaviour with coordinator visibility?", options: ["Procedural: enumerate the exact tool calls and order the subagent must follow","Goal-oriented: state the outcome and success criteria, with the required output schema so the coordinator retains visibility, letting the subagent adapt its route","Give only the topic with no criteria, maximising autonomy","Alternate between goal-oriented and procedural at random to hedge"], correct: 1, explain: "Goal-oriented delegation lets the subagent adapt as it discovers information, while a required output contract preserves the coordinator's visibility and control. Rigid procedural scripts break the moment reality differs from the assumed path; unconstrained autonomy loses control entirely." },
      { domain: "Multi-Agent", d: 3, q: "A coordinator delegates with the instruction 'search the web, then read the top three results, then summarise'. Subagents frequently return thin findings when the top results are irrelevant. What's the flaw?", options: ["The subagent needs a larger context window","The delegation is procedural — it prescribes a fixed sequence rather than the goal, so the subagent follows the script even when intermediate findings show it isn't working","Web search should be removed from the subagent's tools","The coordinator should pass its entire conversation history"], correct: 1, explain: "A fixed procedural sequence executes regardless of intermediate findings. A goal-oriented brief ('establish X with credible sources; if initial results are irrelevant, reformulate') lets the subagent adapt while still reporting against defined criteria." },
      { domain: "Multi-Agent", d: 3, q: "You define a subagent in the Agent SDK, but the coordinator never spawns it — it attempts the work itself instead. Nothing errors. What's the most likely misconfiguration?", options: ["The subagent's system prompt is too short","The Task/Agent tool is missing from the coordinator's allowedTools, so it has no mechanism to delegate","The subagent needs bypassPermissions","Subagent definitions must be registered in CLAUDE.md"], correct: 1, explain: "Coordinator-to-subagent wiring is explicit: without Task (Agent) in the coordinator's allowed tool list there is no delegation mechanism, so it silently does the work inline. Diagnosing spawn failures means checking tool permissions, AgentDefinition parameters, and that wiring." },
      { domain: "Multi-Agent", d: 2, q: "A subagent spawns but immediately fails every task, reporting it cannot access the files it needs. The coordinator works fine. Where do you look first?", options: ["The coordinator's system prompt","The subagent's AgentDefinition — its tool restrictions likely omit the read tools (Read/Grep/Glob) its role requires","The MCP server transport setting","The model's temperature"], correct: 1, explain: "Subagents get their own tool access, scoped by their definition. A role that must inspect files needs the read tools explicitly granted. Diagnosis order for spawn/execution failures: missing tool permissions, then AgentDefinition parameters, then coordinator wiring." },
      { domain: "Agentic Arch", d: 2, q: "A Claude research pipeline is built as a fixed 5-step sequence. When early findings reveal an unexpected subtopic, the pipeline ignores it and produces incomplete coverage. What design change addresses this?", options: ["Add more steps to the fixed sequence to anticipate every subtopic","Decompose into dynamically generated subtasks that adapt as new information is discovered, rather than executing a predetermined sequence regardless of intermediate findings","Run the fixed sequence three times and merge","Increase each step's max_tokens"], correct: 1, explain: "A predetermined sequence can't respond to what it learns. Dynamic decomposition lets the coordinator generate new subtasks from intermediate findings — the mechanism that produces complete coverage when the shape of the topic isn't known upfront." },
      { domain: "Agentic Arch", d: 2, q: "For a task where the required subtasks genuinely cannot be known before exploration begins, which coordinator design is appropriate?", options: ["Pre-generate the full subtask list at turn one so cost is predictable","Run an initial scoping pass, then generate subtasks from what it finds, re-evaluating coverage as results return","Delegate everything to a single subagent and let it decide","Use a fixed sequence and accept incomplete coverage"], correct: 1, explain: "Explore-then-decompose is the pattern: an initial pass establishes the real shape of the problem, subtasks are generated from actual findings, and coverage is re-evaluated as results arrive. Pre-generating a full plan before exploring bakes in assumptions." },
      { domain: "Agentic Arch", d: 1, q: "Three independent documents each need the same analysis, and results are combined at the end. Which orchestration pattern fits, and which would be wrong?", options: ["Sequential pipeline — each document's analysis informs the next","Parallel execution under a coordinator, since the tasks are independent; a sequential pipeline would serialise work that has no dependencies","A single agent processing all three in one context, to preserve continuity","Nested subagents, one spawning the next"], correct: 1, explain: "Pattern selection follows the dependency graph. Independent tasks with a merge step map to coordinator-managed parallel execution. Sequential pipelines are for genuine stage dependencies, where each stage consumes the previous stage's output." },
      { domain: "Agentic Arch", d: 2, q: "A workflow must extract data, then validate it against the extracted values, then generate a report from the validated data. Which pattern, and why not parallel?", options: ["Parallel execution — it's always faster","A sequential pipeline, because each stage consumes the previous stage's output; parallelising would run validation before the data it must validate exists","Coordinator-worker with three independent workers","A single tool call doing all three"], correct: 1, explain: "Each stage strictly depends on the prior stage's output, so the stages must be sequential. Parallel execution only helps where tasks are genuinely independent — forcing it here means validating data that hasn't been produced." },
      { domain: "Claude Code", d: 2, q: "Claude Code generates tests that pass but assert almost nothing meaningful (checking that a function returns 'defined'). How do you raise generation quality?", options: ["Ask for more tests per file","Supply existing test files as context to establish fixture conventions, and specify criteria distinguishing meaningful behavioural assertions from trivial ones","Increase max_tokens so tests can be longer","Run test generation in bypassPermissions mode"], correct: 1, explain: "Test quality comes from concrete context and explicit criteria: existing tests show the fixture and naming conventions to follow, and stated criteria define what a meaningful behavioural assertion is versus a trivial existence check. Volume without criteria produces more trivial tests." },
      { domain: "Claude Code", d: 2, q: "Generated tests are behaviourally reasonable but don't compile — they invent fixture helpers and setup patterns your suite doesn't have. Best fix?", options: ["Post-process the generated tests with a script that rewrites imports","Provide representative existing test files as context so Claude follows your actual fixture conventions and helpers rather than inventing plausible ones","Tell it in the prompt to 'use correct fixtures'","Switch to a larger model"], correct: 1, explain: "Without seeing your conventions, the model produces plausible-looking fixtures from general patterns. Concrete example files are the reliable way to transfer convention. A prompt instruction to 'use correct fixtures' doesn't tell it what yours are." },
      { domain: "CI/CD", d: 2, q: "A single Claude review prompt asks for security issues, business-logic bugs, and API design feedback at once. Recall on each concern is mediocre. What's the fix?", options: ["Combine them into one longer, more emphatic prompt","Design specialised review passes that separate the concerns, each with its own focused prompt and dedicated few-shot examples, avoiding recall trade-offs between competing concerns","Only review for security, as it matters most","Raise temperature so it considers more angles"], correct: 1, explain: "Competing concerns in one prompt force recall trade-offs — attention splits and each dimension suffers. Separate passes, each with concern-specific few-shot examples, let every dimension get full attention, at the cost of more calls." },
      { domain: "CI/CD", d: 3, q: "You've split your Claude Code CI reviews into security, business-logic, and API-design passes. Each pass now needs to reach production quality. What most improves each pass individually?", options: ["Using the same generic few-shot examples across all three passes","Giving each pass dedicated few-shot examples drawn from that specific concern, plus explicit inclusion and exclusion boundaries for that category","Increasing max_tokens on all three","Running each pass twice and taking the union"], correct: 1, explain: "The value of separating passes is realised only if each gets concern-specific examples and explicit inclusion/exclusion boundaries. Shared generic examples reintroduce the ambiguity that splitting was meant to remove." },
      { domain: "Structured Output", d: 2, q: "Extracted dates arrive in mixed forms — '3/4/26', 'March 4 2026', '2026-03-04' — breaking downstream parsing. Schema validation passes each time. Best fix?", options: ["Add a downstream regex normaliser for every known format","Include explicit format normalisation instructions in the extraction prompt (e.g. always ISO 8601 YYYY-MM-DD) alongside the schema, so output is consistent at source","Make the date field a plain string and handle it later","Raise temperature for more format variety"], correct: 1, explain: "A schema typing a field as string accepts any of those forms. Format normalisation belongs in the extraction instructions — specify the canonical representation (ISO 8601) so consistency is produced at source rather than repaired downstream forever." },
      { domain: "Structured Output", d: 2, q: "A status field should only ever be one of pending, shipped, delivered, cancelled, but Claude sometimes returns 'in transit' or 'on the way'. Which schema change fixes this?", options: ["Describe the allowed values in the field's description text","Define the field as an enum with the four permitted values, so anything outside the set is invalid rather than merely discouraged","Make the field nullable so odd values can be dropped","Add a few-shot example for each status"], correct: 1, explain: "Enum definitions constrain a field to a fixed value set at the schema level, making out-of-set values structurally invalid. A description is only a hint; an enum is enforcement — and it pairs well with nullable when the status may genuinely be unknown." },
      { domain: "Context Mgmt", d: 3, q: "SCENARIO — Customer Support Resolution Agent. A conversation runs long and the full history no longer fits Claude's context. Which retention strategy preserves answer quality best?", options: ["Truncate to the most recent N messages and discard the rest","Combine a sliding window of recent turns with a structured state object holding durable facts (order IDs, amounts, entitlements) and selective retention of decisions","Summarise everything into one paragraph and drop all detail","Start a fresh session on every long conversation"], correct: 1, explain: "A sliding window alone silently drops facts established early. Pairing it with a structured state object for durable values plus selective retention of decisions keeps what matters addressable while bounding token growth — naive truncation loses exactly the transactional details that matter." },
      { domain: "Context Mgmt", d: 1, q: "Why is a structured state object preferable to a prose running summary for tracking a Claude agent's accumulated facts across compaction cycles?", options: ["It uses more tokens, giving the model more to work with","It keeps values addressable and unambiguous — fields can be read, updated, and validated individually, whereas prose summaries blur specifics and degrade with each re-summarisation","Prose summaries cannot be included in prompts","Structured state removes the need for any summarisation"], correct: 1, explain: "Each re-summarisation of prose loses precision, and specific values blur into generalities. A structured state object holds fields that can be updated and validated individually, so critical values survive repeated compaction cycles intact." }
    ]
  },
};

const SECONDS_PER_QUESTION = 120; // real exam pace: 60 questions / 120 minutes
const FULL_EXAM_COUNT = 60;       // real exam length
const EXAM_DURATION = FULL_EXAM_COUNT * SECONDS_PER_QUESTION; // 120 minutes
const PASS_SCORE = 720; // out of 1000

// Duration for a given level = 2 minutes per question (real exam pace)
function durationFor(level) {
  const n = level.count || level.questions.length;
  return n * SECONDS_PER_QUESTION;
}

// Paper composition: a difficulty ramp. The paper opens with easy items, moves
// through medium, and finishes on hard ones.
const RAMP = [
  { d: 1, n: 15 },  // first 15: easy
  { d: 2, n: 20 },  // next 20: medium
  { d: 3, n: 25 }   // remaining 25: hard
];

// Build a paper of `n` questions following RAMP. Each tier is shuffled so papers
// still vary between sittings. If a tier is short in this bank, the shortfall is
// backfilled from the nearest tier that has spares, so the paper always reaches
// full length; the easy→medium→hard order of the final paper is preserved.
function buildRampedPaper(bank, n) {
  const pools = { 1: shuffle(bank.filter(q => (q.d || 2) === 1)),
                  2: shuffle(bank.filter(q => (q.d || 2) === 2)),
                  3: shuffle(bank.filter(q => (q.d || 2) === 3)) };

  const scale = n / RAMP.reduce((a, b) => a + b.n, 0);
  const picked = { 1: [], 2: [], 3: [] };

  // First pass: take up to quota from each tier.
  RAMP.forEach(({ d, n: quota }) => {
    picked[d] = pools[d].splice(0, Math.round(quota * scale));
  });

  // Second pass: backfill any shortfall from whichever tier still has spares,
  // preferring the closest difficulty.
  const order = [1, 2, 3];
  let short = n - order.reduce((a, d) => a + picked[d].length, 0);
  while (short > 0) {
    const donor = [2, 3, 1].find(d => pools[d].length > 0);
    if (donor === undefined) break;         // bank smaller than the paper
    picked[donor].push(pools[donor].shift());
    short--;
  }

  return [...picked[1], ...picked[2], ...picked[3]];
}

// Build the question pool for a level.
//  - pool: true  → draw `count` from every other level's bank (fresh paper each sitting)
//  - count set   → draw `count` from this level's own bank
//  - otherwise   → use the whole bank
// In all cases the paper is ordered as a difficulty ramp.
function buildQuestions(level) {
  let bank;
  if (level.pool) {
    bank = [];
    Object.values(LEVELS).forEach(lv => { if (!lv.pool) bank.push(...lv.questions); });
  } else {
    bank = level.questions;
  }
  const n = Math.min(level.count || bank.length, bank.length);
  return prepQuestions(buildRampedPaper(bank, n), { keepOrder: true });
}

// ========================= STATE =========================
let state = {
  screen: 'start', // start | exam | paused | results
  level: null,
  questions: [],
  answers: [],
  struck: [],   // array of Sets
  flagged: [],
  current: 0,
  timeLeft: EXAM_DURATION,
  timerId: null,
  reviewFilter: 'all'
};

const app = document.getElementById('app');

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function prepQuestions(raw, { keepOrder = false } = {}) {
  // Options are always shuffled so the correct answer never sits in a fixed slot.
  // Question order is preserved when the caller has already arranged it (the
  // difficulty ramp), otherwise it's shuffled.
  const list = keepOrder ? raw : shuffle(raw);
  return list.map(q => {
    const correctText = q.options[q.correct];
    const opts = shuffle(q.options);
    return { ...q, options: opts, correct: opts.indexOf(correctText) };
  });
}

function fmtTime(s) {
  const m = Math.floor(s / 60);
  const sec = s % 60;
  return `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
}

// ========================= TIMER =========================
function startTimer() {
  stopTimer();
  state.timerId = setInterval(() => {
    state.timeLeft--;
    updateTimerDisplay();
    if (state.timeLeft <= 0) { finishExam(); }
  }, 1000);
}
function stopTimer() { if (state.timerId) { clearInterval(state.timerId); state.timerId = null; } }
function updateTimerDisplay() {
  const el = document.getElementById('timer');
  if (!el) return;
  el.textContent = fmtTime(state.timeLeft);
  el.className = 'timer' + (state.timeLeft <= 300 ? ' danger' : state.timeLeft <= 900 ? ' warn' : '');
}

// ========================= SCREENS =========================
// In-app confirmation dialog. Native confirm() is blocked in sandboxed
// iframes and silently returns false, so buttons appear dead — this replaces it.
function showConfirm({ title, body, confirmLabel = 'Confirm', cancelLabel = 'Cancel', onConfirm, onCancel }) {
  document.getElementById('confirmOverlay')?.remove();
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.id = 'confirmOverlay';
  ov.innerHTML = `
    <div class="overlay-card" style="max-width:420px">
      <h2 style="font-size:1.3rem">${title}</h2>
      <p>${body}</p>
      <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
        <button class="btn ghost" id="cfCancel">${cancelLabel}</button>
        <button class="btn" id="cfOk">${confirmLabel}</button>
      </div>
    </div>`;
  document.body.appendChild(ov);
  const close = () => ov.remove();
  document.getElementById('cfOk').addEventListener('click', () => { close(); onConfirm && onConfirm(); });
  document.getElementById('cfCancel').addEventListener('click', () => { close(); onCancel && onCancel(); });
}

// Official exam questions sit inside a named scenario. If a question carries a
// "SCENARIO — ... ." prefix, render it as a context banner above the question body.
function formatQuestion(text) {
  const m = text.match(/^SCENARIO — ([^.]+)\.\s*([\s\S]+)$/);
  if (!m) return text;
  return `<div class="scenario-banner">Scenario · ${m[1]}</div>${m[2]}`;
}

function resetToMenu() {
  stopTimer();
  // remove any lingering overlays
  document.getElementById('pauseOverlay')?.remove();
  document.getElementById('confirmOverlay')?.remove();
  // fully reset exam state
  state.screen = 'start';
  state.level = null;
  state.questions = [];
  state.answers = [];
  state.struck = [];
  state.flagged = [];
  state.current = 0;
  state.timeLeft = EXAM_DURATION;
  state.totalTime = EXAM_DURATION;
  state.reviewFilter = 'all';
  renderStart();
}

function renderStart() {
  stopTimer();
  const scenarioColors = ['#26d07c','#3b9ae1','#f0a828','#a678e2','#e0524d','#20c4b8'];
  const levelCards = Object.entries(LEVELS).map(([key, lv], i) => {
    const bp = lv.blueprint || [];
    const bpBar = bp.length ? `
      <div class="bp-bar">
        ${bp.map((s, si) => `<div class="bp-seg" style="width:${s.pct}%;background:${scenarioColors[si % scenarioColors.length]}" title="${s.label} ${s.pct}%"></div>`).join('')}
      </div>
      <div class="bp-legend">
        ${bp.map((s, si) => `<span class="bp-item"><span class="bp-dot" style="background:${scenarioColors[si % scenarioColors.length]}"></span>${s.label} ${s.pct}%</span>`).join('')}
      </div>` : '';
    return `
    <button class="level-card" ${lv.ready ? '' : 'disabled'} data-level="${key}">
      <div class="lc-top">
        <div class="lc-num">${String(i+1).padStart(2,'0')}</div>
        <div style="flex:1">
          <div class="lc-title">${lv.name}</div>
          <div class="lc-desc">${lv.desc}</div>
        </div>
        <div class="lc-badge ${lv.ready ? 'badge-ready' : 'badge-soon'}">${lv.ready ? (lv.count || lv.questions.length) + ' Qs · ' + Math.round(durationFor(lv)/60) + ' min' : 'Soon'}</div>
      </div>
      ${lv.ready ? (() => {
        const bank = lv.pool ? Object.values(LEVELS).filter(x=>!x.pool).flatMap(x=>x.questions) : lv.questions;
        const n = Math.min(lv.count || bank.length, bank.length);
        const paper = buildRampedPaper(bank, n);
        const c = { 1:0, 2:0, 3:0 };
        paper.forEach(q => c[q.d || 2]++);
        const drawn = bank.length > n ? `Drawn fresh from a bank of ${bank.length} — a different paper every sitting. ` : '';
        return `<div style="font-size:0.74rem;color:var(--text-dim);margin-top:-6px">${drawn}Difficulty ramp: <b style="color:var(--text)">${c[1]} easy → ${c[2]} medium → ${c[3]} hard</b></div>`;
      })() : ''}
      ${bpBar}
    </button>`;
  }).join('');

  app.innerHTML = `
    <div class="hero">
      <h1>CCAR-F <span>Exam Simulator</span></h1>
      <p>A full mock of the Claude Certified Architect – Foundations exam (code: CCAR-F). Scenario-based, timed, and built to mirror the real thing.</p>
      <div class="meta-row">
        <span class="chip"><b>120 min</b> · 60 items</span>
        <span class="chip"><b>4 of 6</b> scenarios</span>
        <span class="chip"><b>Scenario-based</b></span>
        <span class="chip">Pass: <b>720/1000</b></span>
      </div>
    </div>
    <div class="section-label">Choose your level</div>
    <div class="levels">${levelCards}</div>
    <p style="color:var(--text-dim);font-size:0.82rem;text-align:center;margin-top:24px;line-height:1.6">
      Every level runs at the real exam's pace — 2 minutes per question. The timer supports <b style="color:var(--text)">pause / resume</b>, so the clock stops while you're away.
    </p>
  `;

  app.querySelectorAll('.level-card:not(:disabled)').forEach(btn => {
    btn.addEventListener('click', () => beginExam(btn.dataset.level));
  });
}

function beginExam(levelKey) {
  const lv = LEVELS[levelKey];
  state.level = levelKey;
  state.questions = buildQuestions(lv);
  state.answers = new Array(state.questions.length).fill(null);
  state.struck = state.questions.map(() => new Set());
  state.flagged = new Array(state.questions.length).fill(false);
  state.current = 0;
  state.totalTime = state.questions.length * SECONDS_PER_QUESTION;
  state.timeLeft = state.totalTime;
  state.screen = 'exam';
  renderExam();
  startTimer();
}

function renderExam() {
  const q = state.questions[state.current];
  const ans = state.answers[state.current];
  const struckSet = state.struck[state.current];
  const answeredCount = state.answers.filter(a => a !== null).length;
  const progress = (answeredCount / state.questions.length) * 100;
  const letters = ['A','B','C','D','E'];

  app.innerHTML = `
    <div class="topbar">
      <div class="brand">CCAR-F <span>Simulator</span></div>
      <div class="timer" id="timer">${fmtTime(state.timeLeft)}</div>
      <div class="timer-controls">
        <button class="icon-btn" id="pauseBtn">⏸ Pause</button>
        <button class="icon-btn" id="exitBtn">✕ Exit</button>
      </div>
    </div>

    <div class="qmeta">
      <span class="qcount">Question ${state.current + 1} / ${state.questions.length}</span>
      <span class="domain-tag">${q.domain}</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" style="width:${progress}%"></div></div>

    <div class="card">
      <div class="qtext">${formatQuestion(q.q)}</div>
      ${q.options.map((opt, i) => {
        const sel = ans === i ? ' selected' : '';
        const st = struckSet.has(i) ? ' struck' : '';
        return `
          <div class="opt${sel}${st}" data-idx="${i}">
            <span class="opt-letter">${letters[i]}</span>
            <span class="opt-body">${opt}</span>
            <button class="strike-btn" data-strike="${i}" title="Strike out">✕</button>
          </div>`;
      }).join('')}
      <div style="font-size:0.76rem;color:var(--text-dim);margin-top:6px">Tip: right-click (or tap ✕ on) an option to cross it out as "definitely not this" — it stays crossed for review.</div>
    </div>

    <div class="nav-row">
      <div class="nav-left">
        <button class="btn ghost" id="prevBtn" ${state.current === 0 ? 'disabled' : ''}>← Prev</button>
        <button class="flag-btn ${state.flagged[state.current] ? 'flagged' : ''}" id="flagBtn">${state.flagged[state.current] ? '★ Flagged' : '☆ Flag'}</button>
      </div>
      ${state.current === state.questions.length - 1
        ? `<button class="btn" id="submitBtn">Submit Exam</button>`
        : `<button class="btn" id="nextBtn">Next →</button>`}
    </div>
  `;

  // option select
  app.querySelectorAll('.opt').forEach(el => {
    el.addEventListener('click', (e) => {
      if (e.target.dataset.strike !== undefined) return;
      const idx = parseInt(el.dataset.idx);
      state.answers[state.current] = idx;
      renderExam();
    });
    // right-click to strike through (mark as "definitely not this")
    el.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      const idx = parseInt(el.dataset.idx);
      if (struckSet.has(idx)) struckSet.delete(idx); else struckSet.add(idx);
      // if you strike your currently-selected answer, clear the selection
      if (struckSet.has(idx) && state.answers[state.current] === idx) state.answers[state.current] = null;
      renderExam();
    });
  });
  // strike
  app.querySelectorAll('.strike-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const idx = parseInt(btn.dataset.strike);
      if (struckSet.has(idx)) struckSet.delete(idx); else struckSet.add(idx);
      renderExam();
    });
  });
  document.getElementById('prevBtn')?.addEventListener('click', () => { state.current--; renderExam(); });
  document.getElementById('nextBtn')?.addEventListener('click', () => { state.current++; renderExam(); });
  document.getElementById('flagBtn')?.addEventListener('click', () => { state.flagged[state.current] = !state.flagged[state.current]; renderExam(); });
  document.getElementById('submitBtn')?.addEventListener('click', confirmSubmit);
  document.getElementById('pauseBtn')?.addEventListener('click', pauseExam);
  document.getElementById('exitBtn')?.addEventListener('click', () => {
    resetToMenu();
  });
  updateTimerDisplay();
}

function pauseExam() {
  stopTimer();
  state.screen = 'paused';
  const unanswered = state.answers.filter(a => a === null).length;
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.id = 'pauseOverlay';
  overlay.innerHTML = `
    <div class="overlay-card">
      <h2>⏸ Paused</h2>
      <p>Time remaining: <b style="color:var(--lime);font-family:var(--font-mono)">${fmtTime(state.timeLeft)}</b><br>
      ${unanswered} question${unanswered!==1?'s':''} still unanswered</p>
      <button class="btn" id="resumeBtn">▶ Resume Exam</button>
    </div>`;
  document.body.appendChild(overlay);
  document.getElementById('resumeBtn').addEventListener('click', () => {
    document.getElementById('pauseOverlay').remove();
    state.screen = 'exam';
    startTimer();
  });
}

function confirmSubmit() {
  const unanswered = state.answers.filter(a => a === null).length;
  stopTimer();
  showConfirm({
    title: unanswered > 0 ? `${unanswered} question${unanswered!==1?'s':''} still unanswered` : 'Submit your exam?',
    body: unanswered > 0 ? 'Unanswered questions are scored as incorrect. Submit anyway?' : 'You will see your score and full answer review.',
    confirmLabel: 'Submit exam',
    onConfirm: finishExam,
    onCancel: () => { if (state.screen === 'exam') startTimer(); }
  });
}

function finishExam() {
  stopTimer();
  state.screen = 'results';
  renderResults();
}

function renderResults() {
  const qs = state.questions;
  let correct = 0;
  const domainStats = {};
  qs.forEach((q, i) => {
    if (!domainStats[q.domain]) domainStats[q.domain] = { correct: 0, total: 0 };
    domainStats[q.domain].total++;
    if (state.answers[i] === q.correct) { correct++; domainStats[q.domain].correct++; }
  });
  const scaled = Math.round((correct / qs.length) * 1000);
  const passed = scaled >= PASS_SCORE;
  const timeUsed = (state.totalTime || EXAM_DURATION) - state.timeLeft;
  const incorrect = qs.length - correct - state.answers.filter(a => a === null).length;
  const skipped = state.answers.filter(a => a === null).length;

  const domainRows = Object.entries(domainStats).map(([d, s]) => {
    const pct = Math.round((s.correct / s.total) * 100);
    const color = pct < 60 ? 'var(--bad)' : pct >= 85 ? 'var(--good)' : 'var(--amber)';
    return `<div class="domain-row">
      <div class="domain-name">${d}</div>
      <div class="domain-bar-bg"><div class="domain-bar-fill" style="width:${pct}%;background:${color}"></div></div>
      <div class="domain-score" style="color:${color}">${s.correct}/${s.total}</div>
    </div>`;
  }).join('');

  app.innerHTML = `
    <div class="topbar">
      <div class="brand">CCAR-F <span>Results</span></div>
      <button class="icon-btn" id="homeBtn">↺ New Exam</button>
    </div>

    <div class="result-hero">
      <div class="score-ring ${passed ? 'pass' : 'fail'}">${scaled}<span style="font-size:1.2rem;color:var(--text-dim)">/1000</span></div>
      <div class="verdict" style="color:${passed ? 'var(--good)' : 'var(--bad)'}">${passed ? '✓ PASS' : '✗ Below passing'}</div>
      <div class="score-sub">Passing score is ${PASS_SCORE}/1000 · You got ${correct} of ${qs.length} correct</div>
      <div class="stat-row">
        <div class="stat"><div class="num" style="color:var(--good)">${correct}</div><div class="lbl">Correct</div></div>
        <div class="stat"><div class="num" style="color:var(--bad)">${incorrect}</div><div class="lbl">Wrong</div></div>
        <div class="stat"><div class="num" style="color:var(--text-dim)">${skipped}</div><div class="lbl">Skipped</div></div>
        <div class="stat"><div class="num">${fmtTime(timeUsed)}</div><div class="lbl">Time used</div></div>
      </div>
    </div>

    <div class="card">
      <div class="section-label">Domain breakdown</div>
      ${domainRows}
    </div>

    <div class="section-label">Question review</div>
    <div class="filter-row">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="incorrect">Wrong only</button>
      <button class="filter-btn" data-filter="skipped">Skipped</button>
      <button class="filter-btn" data-filter="flagged">Flagged</button>
    </div>
    <div id="reviewList"></div>
  `;

  document.getElementById('homeBtn').addEventListener('click', () => { resetToMenu(); });
  app.querySelectorAll('.filter-btn').forEach(b => b.addEventListener('click', () => {
    app.querySelectorAll('.filter-btn').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    state.reviewFilter = b.dataset.filter;
    renderReviewList();
  }));
  renderReviewList();
  window.scrollTo(0, 0);
}

function renderReviewList() {
  const qs = state.questions;
  const letters = ['A','B','C','D','E'];
  const list = document.getElementById('reviewList');
  const items = qs.map((q, i) => {
    const your = state.answers[i];
    const isCorrect = your === q.correct;
    const isSkipped = your === null;
    let statusClass = isSkipped ? 'skipped' : isCorrect ? 'correct' : 'incorrect';
    if (state.reviewFilter === 'incorrect' && (isCorrect || isSkipped)) return '';
    if (state.reviewFilter === 'skipped' && !isSkipped) return '';
    if (state.reviewFilter === 'flagged' && !state.flagged[i]) return '';

    const tag = isSkipped ? `<span class="tag-mini" style="background:#ffffff11;color:var(--text-dim)">Skipped</span>`
      : isCorrect ? `<span class="tag-mini" style="background:#7ed95722;color:var(--good)">Correct</span>`
      : `<span class="tag-mini" style="background:#e5674b22;color:var(--bad)">Wrong</span>`;

    const opts = q.options.map((opt, oi) => {
      let cls = 'review-opt neutral';
      if (oi === q.correct) cls = 'review-opt right-answer';
      if (oi === your && your === q.correct) cls = 'review-opt your-correct';
      if (oi === your && your !== q.correct) cls = 'review-opt your-wrong';
      const wasStruck = state.struck[i] && state.struck[i].has(oi);
      if (wasStruck) cls += ' struck-review';
      const mark = oi === q.correct ? ' ✓' : (oi === your && your !== q.correct ? ' ✗ (your answer)' : '');
      const struckTag = wasStruck ? ' <span style="font-size:0.7rem;color:var(--text-dim)">(you crossed out)</span>' : '';
      return `<div class="${cls}">${letters[oi]}. ${opt}${mark}${struckTag}</div>`;
    }).join('');

    return `
      <div class="review-item ${statusClass}">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <span class="domain-tag">${q.domain}</span>
          <span>${tag} ${state.flagged[i] ? '<span class="tag-mini" style="background:#e8b04b22;color:var(--amber)">★ Flagged</span>' : ''}</span>
        </div>
        <div class="review-q">Q${i+1}. ${formatQuestion(q.q)}</div>
        ${opts}
        <div class="review-explain"><b style="color:var(--lime)">Why:</b> ${q.explain}</div>
      </div>`;
  }).join('');
  list.innerHTML = items || `<p style="color:var(--text-dim);text-align:center;padding:20px">Nothing to show for this filter.</p>`;
}

// init
renderStart();
</script>
</body>
</html>
